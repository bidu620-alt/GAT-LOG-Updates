name: Publish GAT Telemetria DotNet 1.0.14 Trip Journal

on:
  push:
    branches: [client-dotnet-winforms]
    paths:
      - 'client-dotnet/publish-1.0.14-trip-journal.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-dotnet-winforms
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply preserved client through 1.0.9
        shell: pwsh
        run: |
          python client-dotnet/build103/apply_103_fixed_servers.py
          python client-dotnet/build104/apply_104_steam_identity.py
          python client-dotnet/build105/apply_105_robust_driver_identity.py
          python client-dotnet/build106/apply_106_gat_account.py
          python client-dotnet/build106/fix_106_account_labels.py
          python client-dotnet/build107/apply_107_mission_progress.py
          python client-dotnet/build107/fix_107_versions.py
          python client-dotnet/build108/apply_108_live_map_truck.py
          python client-dotnet/build109/apply_109_independent_central.py

      - name: Apply maps, voice, status and trip journal
        shell: pwsh
        run: |
          python client-dotnet/build110/apply_110_map_mode.py
          python client-dotnet/build111/apply_111_eaa_map.py
          python client-dotnet/build112/apply_112_voice_work_started.py
          python client-dotnet/build113/apply_113_work_status.py
          python client-dotnet/build114/apply_114_trip_journal.py
          $main = Get-Content 'client-dotnet/GatTelemetry/MainForm.cs' -Raw
          $api = Get-Content 'client-dotnet/GatTelemetry/ApiClient.cs' -Raw
          $journal = Get-Content 'client-dotnet/GatTelemetry/TripJournal.cs' -Raw
          if ($main -notmatch 'CurrentVersion = "1\.0\.14"') { throw 'Versao 1.0.14 ausente.' }
          if ($main -notmatch 'CaptureTripJournalAsync') { throw 'Captura local ausente.' }
          if ($main -notmatch 'FlushTripReceiptsAsync') { throw 'Fila de recibos ausente.' }
          if ($api -notmatch '/api/account/trip-complete') { throw 'Endpoint de recibo ausente.' }
          if ($journal -notmatch 'trip_journal\.json') { throw 'Arquivo persistente ausente.' }
          if ($journal -notmatch 'plannedDistanceKm') { throw 'Distancia planejada do ETS2 ausente.' }
          if ($journal -notmatch 'gameplay\.jobDelivered') { throw 'Evento oficial de entrega ausente.' }
          if ($main -notmatch 'SpeechSynthesizer') { throw 'Aviso por voz perdido.' }
          if ($main -notmatch 'TRABALHO EM ANDAMENTO') { throw 'Status de trabalho perdido.' }

      - name: Reuse blue GAT CLIENT icon
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'GAT_TELEMETRIA_1.0.13.exe'
          Invoke-WebRequest 'https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.13_STATUS_TESTE.exe' -OutFile $src
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($src)
          if ($null -eq $icon) { throw 'Nao foi possivel extrair o icone azul.' }
          $paths = @('client-dotnet/GatTelemetry/assets/GAT_CLIENT.ico','client-dotnet/GatTelemetryInstaller/assets/GAT_CLIENT.ico')
          foreach ($p in $paths) { New-Item -ItemType Directory -Force (Split-Path $p -Parent) | Out-Null; $fs=[System.IO.File]::Create($p); try {$icon.Save($fs)} finally {$fs.Dispose()} }
          $icon.Dispose()

      - name: Ensure application icons
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          proj=Path('client-dotnet/GatTelemetry/GatTelemetry.csproj'); s=proj.read_text(encoding='utf-8')
          if '<ApplicationIcon>' not in s: s=s.replace('<ApplicationManifest>app.manifest</ApplicationManifest>','<ApplicationManifest>app.manifest</ApplicationManifest>\n    <ApplicationIcon>assets\\GAT_CLIENT.ico</ApplicationIcon>',1)
          proj.write_text(s,encoding='utf-8')
          ip=Path('client-dotnet/GatTelemetryInstaller/GatTelemetryInstaller.csproj'); x=ip.read_text(encoding='utf-8')
          if '<ApplicationIcon>' not in x: x=x.replace('<ApplicationManifest>app.manifest</ApplicationManifest>','<ApplicationManifest>app.manifest</ApplicationManifest>\n    <ApplicationIcon>assets\\GAT_CLIENT.ico</ApplicationIcon>',1)
          ip.write_text(x,encoding='utf-8')
          '@ | Set-Content "$env:RUNNER_TEMP\icons114.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\icons114.py"

      - name: Build CSharp telemetry client and updater
        shell: pwsh
        run: |
          dotnet restore client-dotnet/GatTelemetry/GatTelemetry.csproj
          dotnet build client-dotnet/GatTelemetry/GatTelemetry.csproj -c Release --no-restore
          $out='client-dotnet/GatTelemetry/bin/Release/net48'; $pay='client-dotnet/GatTelemetryInstaller/payload'
          if (Test-Path $pay) { Remove-Item $pay -Recurse -Force }
          New-Item -ItemType Directory -Force $pay | Out-Null
          Copy-Item "$out/GAT_TELEMETRIA.exe" "$pay/GAT_TELEMETRIA.exe" -Force
          Copy-Item "$out/GAT_TELEMETRIA.exe.config" "$pay/GAT_TELEMETRIA.exe.config" -Force
          Copy-Item "$out/Newtonsoft.Json.dll" "$pay/Newtonsoft.Json.dll" -Force
          dotnet restore client-dotnet/GatTelemetryInstaller/GatTelemetryInstaller.csproj
          dotnet build client-dotnet/GatTelemetryInstaller/GatTelemetryInstaller.csproj -c Release --no-restore
          $update='client-dotnet/GatTelemetryInstaller/bin/Release/net48/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.14_JOURNAL_TESTE.exe'
          if (-not (Test-Path $update)) { throw 'Atualizador 1.0.14 nao gerado.' }
          Copy-Item $update "$env:RUNNER_TEMP/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.14_JOURNAL_TESTE.exe" -Force

      - name: Publish updater and manifest to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main; git reset --hard HEAD; git clean -fdx; git checkout -B main origin/main
          mkdir -p releases; cp "$RUNNER_TEMP/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.14_JOURNAL_TESTE.exe" releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.14_JOURNAL_TESTE.exe
          SHA=$(sha256sum releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.14_JOURNAL_TESTE.exe | awk '{print $1}')
          cat > client_dotnet_version.json <<EOF
          {
            "app": "GAT Telemetria CSharp",
            "channel": "test-dotnet",
            "version": "1.0.14",
            "display_version": "1.0.14 DIARIO DE VIAGEM",
            "notas": "O GAT Telemetria passa a guardar a viagem localmente em trip_journal.json, independente da internet e do servidor de comboio. Se o cliente entrar no meio da viagem, usa a distancia planejada original do contrato ETS2. Ao receber JobDelivered, cria um recibo persistente e tenta envia-lo diretamente para a Central GAT ate receber confirmacao, evitando perder entregas em quedas ou intervalos de telemetria.",
            "setup_url": "https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.14_JOURNAL_TESTE.exe",
            "sha256": "$SHA"
          }
          EOF
          git add releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.14_JOURNAL_TESTE.exe client_dotnet_version.json
          git commit -m "Publica GAT Telemetria 1.0.14 com diario local de viagem"
          git push origin main
