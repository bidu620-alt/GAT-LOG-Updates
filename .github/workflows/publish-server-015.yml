name: Publish GAT-LOG Server Native 0.1.5

on:
  push:
    branches:
      - main
    paths:
      - 'server-native-0.1/publish-0.1.5.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recover native source
        shell: bash
        run: |
          set +e
          rm -rf /tmp/gat-src && mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          set -e
          test -f /tmp/gat-src/go.mod
          test -f /tmp/gat-src/internal/core/core.go
          test -f /tmp/gat-src/cmd/agent/main.go
          test -f /tmp/gat-src/cmd/ui/main.go

      - name: Apply 0.1.5 fixes
        shell: bash
        run: |
          python3 server-native-0.1/build015/apply_015.py
          python3 server-native-0.1/build015/fix_check_update.py
          cd /tmp/gat-src
          gofmt -w internal/core/core.go cmd/agent/main.go cmd/ui/main.go

      - name: Restore compile-time asset fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gat-src/cmd/ui/assets
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > /tmp/gat-src/cmd/ui/assets/banner.png
          cp /tmp/gat-src/cmd/ui/assets/banner.png /tmp/gat-src/cmd/ui/assets/logo.png

      - name: Build Windows UI and agent
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gat-src
          mkdir -p /tmp/dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/dist/GAT_LOG_SERVER.exe ./cmd/ui
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/dist/GAT_LOG_AGENT.exe ./cmd/agent
          sha256sum /tmp/dist/GAT_LOG_SERVER.exe /tmp/dist/GAT_LOG_AGENT.exe

      - name: Build Windows updater
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/updater/assets
          cp server-native-0.1/build015/updater_main.go /tmp/updater/main.go
          cp /tmp/dist/GAT_LOG_SERVER.exe /tmp/updater/assets/GAT_LOG_SERVER.exe
          cp /tmp/dist/GAT_LOG_AGENT.exe /tmp/updater/assets/GAT_LOG_AGENT.exe
          printf 'module gatlogupdater015\n\ngo 1.23\n' > /tmp/updater/go.mod
          cd /tmp/updater
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/dist/GAT_LOG_SERVER_UPDATE_0.1.5.exe .

      - name: Publish binary and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cp /tmp/dist/GAT_LOG_SERVER_UPDATE_0.1.5.exe releases/GAT_LOG_SERVER_UPDATE_0.1.5.exe
          SHA=$(sha256sum releases/GAT_LOG_SERVER_UPDATE_0.1.5.exe | awk '{print $1}')
          cat > server_native_version.json <<EOF
          {
            "app": "GAT-LOG Server Native",
            "channel": "stable-native",
            "version": "0.1.5",
            "display_version": "0.1.5",
            "notas": "GAT-LOG Server Native 0.1.5: corrige o travamento ao abrir o aplicativo. A janela agora abre sem esperar o agente; leitura de sessao e server.log roda em segundo plano; o status usa cache; chamadas locais possuem timeout menor; telemetria e Funnel nao bloqueiam a interface. Mantem as correcoes da 0.1.4 e preserva configuracoes, mods, moderador e historico.",
            "setup_url": "https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_LOG_SERVER_UPDATE_0.1.5.exe",
            "sha256": "$SHA"
          }
          EOF
          sha256sum releases/GAT_LOG_SERVER_UPDATE_0.1.5.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/GAT_LOG_SERVER_UPDATE_0.1.5.exe server_native_version.json
          git commit -m "Publica GAT-LOG Server Native 0.1.5"
          git push
