name: Build GAT Map Exporter Large

on:
  push:
    branches: [map-exporter-large]
    paths:
      - 'map-exporter-large/build-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout GAT patches
        uses: actions/checkout@v4
        with:
          ref: map-exporter-large
          path: gat

      - name: Checkout TsMap tile exporter base
        uses: actions/checkout@v4
        with:
          repository: ETS2LA/tilemap
          ref: 5424eced8758970c129027bfb9b3b3b23c6c5b40
          path: upstream

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore dependencies
        shell: pwsh
        run: nuget restore upstream/TsMap.sln

      - name: Apply GAT large-map patch
        shell: pwsh
        run: python gat/map-exporter-large/patch_tsmap_large.py

      - name: Validate diagnostic build source
        shell: pwsh
        run: |
          $setup = Get-Content 'upstream/TsMap.Canvas/SetupForm.cs' -Raw
          $program = Get-Content 'upstream/TsMap.Canvas/Program.cs' -Raw
          if ($setup -notmatch 'GAT_MAP_LOAD_ERROR\.log') { throw 'Log de carregamento ausente.' }
          if ($setup -notmatch 'WriteLoadLog\("ERRO AO CARREGAR MAPA"') { throw 'Tratamento do Continue ausente.' }
          if ($program -notmatch 'GAT_MAP_CRASH\.log') { throw 'Log global de crash ausente.' }

      - name: Build x64 Release
        shell: pwsh
        run: msbuild upstream/TsMap.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Prepare portable package
        shell: pwsh
        run: |
          $src = 'upstream/TsMap.Canvas/bin/x64/Release'
          $dst = 'package/GAT_MAP_EXPORTER_LARGE'
          if (-not (Test-Path "$src/GAT_MAP_EXPORTER_LARGE.exe")) { throw 'Executavel GAT_MAP_EXPORTER_LARGE.exe nao foi gerado.' }
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$src/*" $dst -Recurse -Force
          @'
          GAT MAP EXPORTER LARGE - TESTE 0.2 DIAGNOSTICO

          Esta versao mantem as melhorias da 0.1 e corrige o principal problema de teste:
          ao clicar CONTINUE, um erro durante a leitura do mapa nao pode mais simplesmente fechar o aplicativo.

          Se o mapa nao carregar:
          - a tela de configuracao permanece aberta;
          - aparece uma mensagem com o erro;
          - GAT_MAP_LOAD_ERROR.log e criado na mesma pasta do executavel;
          - falhas gerais tambem sao registradas em GAT_MAP_CRASH.log.

          TESTE
          1. Selecione a pasta raiz do Euro Truck Simulator 2 (onde existe base.scs).
          2. Marque os mods do mapa e deixe na ordem correta.
          3. Clique Continue.
          4. Se abrir o mapa, seguimos para gerar Tile Map zoom 0-6.
          5. Se der erro, envie GAT_MAP_LOAD_ERROR.log ao ChatGPT. Ele contem o motivo tecnico, a ordem dos mods e os caminhos usados.

          Exportacao grande:
          - x64;
          - tiles existentes sao reaproveitados;
          - escrita .tmp -> .png;
          - erro individual de tile vai para GAT_MAP_EXPORT_ERRORS.log;
          - progresso menos frequente e coleta periodica de memoria.
          '@ | Set-Content "$dst/LEIA-ME-GAT.txt" -Encoding UTF8
          Compress-Archive -Path "$dst/*" -DestinationPath 'GAT_MAP_EXPORTER_LARGE_TESTE_0.2_DIAGNOSTICO.zip' -Force

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: GAT_MAP_EXPORTER_LARGE_TESTE_0.2_DIAGNOSTICO
          path: GAT_MAP_EXPORTER_LARGE_TESTE_0.2_DIAGNOSTICO.zip
          retention-days: 30
