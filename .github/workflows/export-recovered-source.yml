name: Export recovered server source

on:
  push:
    branches:
      - release/server-0.1.3

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover source
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          set -e
          test -f /tmp/gat-src/internal/core/core.go
          test -f /tmp/gat-src/cmd/agent/main.go
          test -f /tmp/gat-src/cmd/ui/main.go
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-server-source
          path: |
            /tmp/gat-src/go.mod
            /tmp/gat-src/internal/core/core.go
            /tmp/gat-src/cmd/agent/main.go
            /tmp/gat-src/cmd/ui/main.go
          retention-days: 7
