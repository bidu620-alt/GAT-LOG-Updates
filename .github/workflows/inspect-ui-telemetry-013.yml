name: Inspect UI telemetry 0.1.3

on:
  push:
    branches:
      - fix/server-ui-freeze

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover source and inspect UI
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          echo '=== UI telemetry refs ==='
          grep -nEi -C 50 'Telemetry|telemetry|Nenhuma telemetria|refreshAll|populatePage|pageTelemetry' /tmp/gat-src/cmd/ui/main.go | head -n 6000
          exit 0
