name: Fix Mower cargo catalog name
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/fix-mower-catalog-name.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Correct exact official cargo name safely
        shell: python
        run: |
          import json
          from pathlib import Path
          p=Path('docs/ets2-official-cargos.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          target='Mower Conditioner Krone BiG M 450'
          changed=False
          found=False
          for rows in (data.get('categories') or {}).values():
              if not isinstance(rows,list):
                  continue
              for row in rows:
                  if not isinstance(row,dict):
                      continue
                  name=str(row.get('name') or '')
                  if row.get('dlc')=='KRONE Agriculture Equipment' and name.startswith('Mower Conditioner Krone BiG M 45'):
                      found=True
                      if name!=target:
                          row['name']=target
                          changed=True
          if not found:
              raise SystemExit('Cargo Mower Conditioner nao encontrado no catalogo')
          if changed:
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit catalog correction to PR branch
        shell: bash
        run: |
          if git diff --quiet -- docs/ets2-official-cargos.json; then exit 0; fi
          git config user.name 'GAT Catalog Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/ets2-official-cargos.json
          git commit -m 'Site: fix Mower Conditioner Krone BiG M 450 exactly'
          git push origin HEAD:${{ github.head_ref }}
