name: Publish GAT Telemetria 1.0.70 SPEED ONLY on site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-gat-telemetria-1.0.70-site.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download successful 1.0.70 SPEED ONLY build
        uses: actions/download-artifact@v4
        with:
          name: GAT-Telemetria-Hub-1.0.70-SPEED-ONLY
          path: publish170
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35176623309

      - name: Publish installer, site card and updater metadata
        shell: bash
        run: |
          set -euo pipefail
          setup='publish170/GAT_TELEMETRIA_SETUP_1.0.70.exe'
          test -s "$setup"
          mkdir -p releases
          cp "$setup" 'releases/GAT_TELEMETRIA_SETUP_1.0.70.exe'
          sha="$(sha256sum 'releases/GAT_TELEMETRIA_SETUP_1.0.70.exe' | awk '{print $1}')"
          echo "GAT 1.0.70 sha256=$sha"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_SETUP_1.0.67.exe'
          new = 'https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_SETUP_1.0.70.exe'
          if old not in s:
              raise SystemExit('Link antigo 1.0.67 nao encontrado no site')
          s = s.replace(old, new, 1)
          s = s.replace('<strong>GAT Telemetria</strong>', '<strong>GAT Telemetria 1.0.70 SPEED ONLY</strong>', 1)
          old_desc = 'Pacotes de voz personalizáveis: substitua a voz, adicione novas falas por grupo, baixe o modelo TXT e restaure backup. Mantém 122 falas + 12 limites, volume, mute, DASH proporcional e vídeo sem borda.'
          new_desc = 'Versão 1.0.70 SPEED ONLY: mantém somente os alertas de limite e velocidade da rodovia. As demais falas automáticas ficam desativadas.'
          if old_desc in s:
              s = s.replace(old_desc, new_desc, 1)
          p.write_text(s, encoding='utf-8')
          PY

          cat > latest.json <<EOF
          {
            "version": "1.0.70",
            "name": "GAT Telemetria 1.0.70 SPEED ONLY",
            "url": "https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_SETUP_1.0.70.exe",
            "sha256": "${sha}",
            "args": "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-"
          }
          EOF

          cp latest.json latest-template.json

      - name: Commit site publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/GAT_TELEMETRIA_SETUP_1.0.70.exe docs/index.html latest.json latest-template.json
          git commit -m 'Publish GAT Telemetria 1.0.70 SPEED ONLY on site'
          git push origin main
