name: Inspect live telemetry contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-live-telemetry-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

# Recheck solicitado em 2026-09-02 02:08 UTC.
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Central GAT health and Biduzao live payload
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HEALTH ==='
          curl -fsS https://api.gatlogets2.com.br/health | jq '{ok,agent_version,mission_min_km,time}'
          echo '=== BIDUZAO LIVE ==='
          curl -fsS https://api.gatlogets2.com.br/api/public/account-live | jq '{updated_at, telemetry: [.telemetry[] | select((.account_user // "") == "biduzao") | {driver,account_user,updated_at,on_job,cargo_name,mass_kg,remaining_km,rank_status, telemetry: {gat_client_version:.telemetry.gat_client_version, gat_schema:.telemetry.gat_schema, gat_job_state:.telemetry.gat_job_state, gat_job_event:.telemetry.gat_job_event, gat_job_event_key:.telemetry.gat_job_event_key, gat_trip_id:.telemetry.gat_trip_id, job_latched:.telemetry.job_latched, job_latch_key:.telemetry.job_latch_key, on_job:.telemetry.on_job, gameplay_onJob:.telemetry.gameplay.onJob, cargo_name:.telemetry.cargo_name, cargo_id:.telemetry.cargo_id, mass_kg:.telemetry.mass_kg, remaining_km:.telemetry.remaining_km, planned_distance_km:.telemetry.planned_distance_km, source_city:.telemetry.source_city, destination_city:.telemetry.destination_city, gameplay_jobDelivered:.telemetry.gameplay.jobDelivered, gameplay_jobCancelled:.telemetry.gameplay.jobCancelled, jobDelivered:.telemetry.jobDelivered, jobCancelled:.telemetry.jobCancelled, deliveredDetails:.telemetry.gameplay.jobDeliveredDetails}}]}'
          echo '=== BIDUZAO PROFILE MISSION ==='
          curl -fsS 'https://api.gatlogets2.com.br/api/public/driver?user=biduzao' | jq '{ok, monthly_completed:.profile.monthly_completed, mission:.profile.current_mission}'
