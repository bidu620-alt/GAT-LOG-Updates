name: Inspect server startup freeze 0.1.5

on:
  push:
    branches:
      - fix/server-startup-freeze-015
    paths:
      - '.github/workflows/inspect-server-startup-015.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover source
        shell: bash
        run: |
          set +e
          rm -rf /tmp/gat-src && mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          exit 0
      - name: Inspect UI startup
        shell: bash
        run: |
          set +e
          F=/tmp/gat-src/cmd/ui/main.go
          grep -a -n -C 90 '^func main' "$F"
          grep -a -n -C 80 '^func ensureAgent' "$F"
          grep -a -n -C 80 '^func (a \*App) pollAgent' "$F"
          grep -a -n -C 80 '^func (a \*App) refreshAll' "$F"
          exit 0
      - name: Inspect agent startup
        shell: bash
        run: |
          set +e
          F=/tmp/gat-src/cmd/agent/main.go
          echo '=== agent functions ==='
          grep -a -nE '^func (main|newAgent|.*serve|.*run|.*pollLoop|.*refreshStatus|.*ensureFunnel|.*loadTelemetry)' "$F" | head -n 1000
          echo '=== agent main/startup ==='
          grep -a -nEi -C 90 '^func main|ListenAndServe|refreshStatus\(|pollLoop\(|StartFunnel|ensureFunnel|http\.Server|ServeMux|HandleFunc' "$F" | head -n 8000
          exit 0
      - name: Inspect core refresh costs
        shell: bash
        run: |
          set +e
          F=/tmp/gat-src/internal/core/core.go
          grep -a -nEi -C 70 '^func (BuildStatus|ParseSession|Read.*Log|Find.*Log|Detect|StartFunnel|TailscalePublicURL)|server\.log|ReadFile|ReadDir|Walk|RunHidden|exec\.Command' "$F" | head -n 10000
          exit 0
