name: Inspect server startup freeze 0.1.5

on:
  push:
    branches:
      - fix/server-startup-freeze-015
    paths:
      - '.github/workflows/inspect-server-startup-015.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover source
        shell: bash
        run: |
          set +e
          rm -rf /tmp/gat-src && mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          exit 0
      - name: Inspect embedded UI assets
        shell: bash
        run: |
          set +e
          F=/tmp/gat-src/cmd/ui/main.go
          echo '=== top 80 ==='
          head -n 80 "$F"
          echo '=== loadImages ==='
          grep -a -n -A45 -B5 '^func (a \*App) loadImages' "$F"
          echo '=== image uses ==='
          grep -a -nE 'bannerBytes|logoBytes|iconBytes|bannerPix|logoPix|embed' "$F"
          exit 0
