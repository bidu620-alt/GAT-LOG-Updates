name: Inspect server startup freeze 0.1.5

on:
  push:
    branches:
      - fix/server-startup-freeze-015
    paths:
      - '.github/workflows/inspect-server-startup-015.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover source
        shell: bash
        run: |
          set +e
          rm -rf /tmp/gat-src && mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          exit 0
      - name: Inspect end of UI source
        shell: bash
        run: |
          set +e
          F=/tmp/gat-src/cmd/ui/main.go
          echo '=== line count ==='
          wc -l "$F"
          echo '=== functions near end ==='
          grep -a -n '^func ' "$F" | tail -n 80
          echo '=== last 280 lines ==='
          tail -n 280 "$F"
          exit 0
