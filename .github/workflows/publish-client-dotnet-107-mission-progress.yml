name: Publish GAT Telemetria DotNet 1.0.7 Mission Progress

on:
  push:
    branches: [client-dotnet-winforms]
    paths:
      - 'client-dotnet/publish-1.0.7-mission-progress.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-dotnet-winforms
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply preserved client base through 1.0.6
        shell: pwsh
        run: |
          python client-dotnet/build103/apply_103_fixed_servers.py
          python client-dotnet/build104/apply_104_steam_identity.py
          python client-dotnet/build105/apply_105_robust_driver_identity.py
          python client-dotnet/build106/apply_106_gat_account.py
          python client-dotnet/build106/fix_106_account_labels.py

      - name: Apply 1.0.7 mission progress
        shell: pwsh
        run: |
          python client-dotnet/build107/apply_107_mission_progress.py
          python client-dotnet/build107/fix_107_versions.py
          $main = Get-Content 'client-dotnet/GatTelemetry/MainForm.cs' -Raw
          $api = Get-Content 'client-dotnet/GatTelemetry/ApiClient.cs' -Raw
          $tele = Get-Content 'client-dotnet/GatTelemetry/TelemetryEngine.cs' -Raw
          if ($main -notmatch 'CurrentVersion = "1\.0\.7"') { throw 'Versão 1.0.7 ausente.' }
          if ($main -notmatch 'SendAccountTelemetryAsync') { throw 'Envio de progresso central ausente.' }
          if ($api -notmatch '/api/account/telemetry') { throw 'Endpoint de progresso ausente.' }
          if ($api -notmatch 'PostBearerAsync') { throw 'Bearer POST ausente.' }
          if ($tele -notmatch 'job_market') { throw 'Mercado World of Trucks não normalizado.' }
          if ($main -notmatch 'ChooseDriver\(players\.Players, identityTelemetry\)') { throw 'Identificação robusta 1.0.5 foi perdida.' }
          if ($main -notmatch 'CONTA GAT') { throw 'Conta GAT foi perdida.' }

      - name: Reuse blue GAT CLIENT icon
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'GAT_TELEMETRIA_1.0.6.exe'
          Invoke-WebRequest 'https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.6_TESTE.exe' -OutFile $src
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($src)
          if ($null -eq $icon) { throw 'Não foi possível extrair o ícone azul.' }
          $paths = @('client-dotnet/GatTelemetry/assets/GAT_CLIENT.ico','client-dotnet/GatTelemetryInstaller/assets/GAT_CLIENT.ico')
          foreach ($p in $paths) {
            New-Item -ItemType Directory -Force (Split-Path $p -Parent) | Out-Null
            $fs=[System.IO.File]::Create($p); try {$icon.Save($fs)} finally {$fs.Dispose()}
          }
          $icon.Dispose()

      - name: Ensure application icons
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          proj=Path('client-dotnet/GatTelemetry/GatTelemetry.csproj')
          s=proj.read_text(encoding='utf-8')
          if '<ApplicationIcon>' not in s:
              s=s.replace('<ApplicationManifest>app.manifest</ApplicationManifest>','<ApplicationManifest>app.manifest</ApplicationManifest>\n    <ApplicationIcon>assets\\GAT_CLIENT.ico</ApplicationIcon>',1)
          proj.write_text(s,encoding='utf-8')
          ip=Path('client-dotnet/GatTelemetryInstaller/GatTelemetryInstaller.csproj')
          x=ip.read_text(encoding='utf-8')
          if '<ApplicationIcon>' not in x:
              x=x.replace('<ApplicationManifest>app.manifest</ApplicationManifest>','<ApplicationManifest>app.manifest</ApplicationManifest>\n    <ApplicationIcon>assets\\GAT_CLIENT.ico</ApplicationIcon>',1)
          ip.write_text(x,encoding='utf-8')
          '@ | Set-Content "$env:RUNNER_TEMP\icons107.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\icons107.py"

      - name: Build CSharp telemetry client
        shell: pwsh
        run: |
          dotnet restore client-dotnet/GatTelemetry/GatTelemetry.csproj
          dotnet build client-dotnet/GatTelemetry/GatTelemetry.csproj -c Release --no-restore
          if (-not (Test-Path 'client-dotnet/GatTelemetry/bin/Release/net48/GAT_TELEMETRIA.exe')) { throw 'Cliente não gerado.' }

      - name: Prepare updater payload
        shell: pwsh
        run: |
          $out='client-dotnet/GatTelemetry/bin/Release/net48'
          $pay='client-dotnet/GatTelemetryInstaller/payload'
          if (Test-Path $pay) { Remove-Item $pay -Recurse -Force }
          New-Item -ItemType Directory -Force $pay | Out-Null
          Copy-Item "$out/GAT_TELEMETRIA.exe" "$pay/GAT_TELEMETRIA.exe" -Force
          Copy-Item "$out/GAT_TELEMETRIA.exe.config" "$pay/GAT_TELEMETRIA.exe.config" -Force
          Copy-Item "$out/Newtonsoft.Json.dll" "$pay/Newtonsoft.Json.dll" -Force

      - name: Build 1.0.7 updater
        shell: pwsh
        run: |
          dotnet restore client-dotnet/GatTelemetryInstaller/GatTelemetryInstaller.csproj
          dotnet build client-dotnet/GatTelemetryInstaller/GatTelemetryInstaller.csproj -c Release --no-restore
          $update='client-dotnet/GatTelemetryInstaller/bin/Release/net48/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.7_TESTE.exe'
          if (-not (Test-Path $update)) { throw 'Atualizador 1.0.7 não gerado.' }
          Copy-Item $update "$env:RUNNER_TEMP/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.7_TESTE.exe" -Force

      - name: Publish updater and manifest to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard HEAD
          git clean -fdx
          git checkout -B main origin/main
          mkdir -p releases
          cp "$RUNNER_TEMP/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.7_TESTE.exe" releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.7_TESTE.exe
          SHA=$(sha256sum releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.7_TESTE.exe | awk '{print $1}')
          cat > client_dotnet_version.json <<EOF
          {
            "app": "GAT Telemetria CSharp",
            "channel": "test-dotnet",
            "version": "1.0.7",
            "display_version": "1.0.7 TESTE",
            "notas": "Liga a Conta GAT ao histórico e às missões mensais. O cliente envia ao servidor central o mercado da carga, distância, peso, rota e estado da viagem para iniciar e concluir automaticamente trabalhos GAT válidos, preservando a identificação robusta, os dois servidores e a Conta GAT da 1.0.6.",
            "setup_url": "https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.7_TESTE.exe",
            "sha256": "$SHA"
          }
          EOF
          git add releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.7_TESTE.exe client_dotnet_version.json
          git commit -m "Publica GAT Telemetria 1.0.7 com progresso de missoes"
          git push origin main
