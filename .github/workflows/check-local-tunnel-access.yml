name: Check GAT local tunnel permissions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-local-tunnel-access.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check tunnel and DNS access without changing configuration
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          endpoints={
              'tunnels':'https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/cfd_tunnel?is_deleted=false',
              'zone':'https://api.cloudflare.com/client/v4/zones?name=gatlogets2.com.br',
          }
          for label,url in endpoints.items():
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:data=json.load(response)
                  if data.get('success'):
                      print(json.dumps({'check':label,'allowed':True,'items':[{k:x.get(k) for k in ('id','name','status')} for x in data.get('result',[])]}))
                  else:print(json.dumps({'check':label,'allowed':False,'codes':[x.get('code') for x in data.get('errors',[])]}))
              except urllib.error.HTTPError as error:
                  print(json.dumps({'check':label,'allowed':False,'http_status':error.code}))
          PY
