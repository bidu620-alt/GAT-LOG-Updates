name: Build GAT-LOG Server 0.1.4 test

on:
  push:
    branches:
      - release/server-0.1.3

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover agent source
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          set -e
          test -f /tmp/gat-src/go.mod
          test -f /tmp/gat-src/internal/core/core.go
          test -f /tmp/gat-src/cmd/agent/main.go

      - name: Apply 0.1.4 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          core=Path('/tmp/gat-src/internal/core/core.go')
          s=core.read_text(encoding='utf-8')
          s=s.replace('InternalVersion = "0.1.0"','InternalVersion = "0.1.4"')
          old=r'(?im)^.*?\[MP\]\s+([^\r\n,]+?)\s+(connected|disconnected)(?:,|\s|$)'
          new=r'(?im)^.*?\[MP\]\s+([^\[\r\n,]+?)\s+(connected|disconnected)(?:,|\s|$)'
          if old not in s:
              raise SystemExit('player regex not found')
          s=s.replace(old,new)
          old_path='func TelemetryPath() string   { return filepath.Join(DataDir(), "telemetry", "current.json") }'
          new_path='func TelemetryPath() string   { return filepath.Join(DataDir(), "telemetry.json") }'
          if old_path not in s:
              raise SystemExit('telemetry path not found')
          s=s.replace(old_path,new_path)
          start=s.index('func StartFunnel() error {')
          end=s.index('\nfunc AppendLog(', start)
          replacement=r'''func tailscaleExe() string {
	exe := "tailscale.exe"
	candidates := []string{filepath.Join(os.Getenv("ProgramFiles"), "Tailscale", "tailscale.exe"), filepath.Join(os.Getenv("ProgramFiles(x86)"), "Tailscale", "tailscale.exe")}
	for _, p := range candidates {
		if _, e := os.Stat(p); e == nil {
			return p
		}
	}
	return exe
}

func StartFunnel() error {
	exe := tailscaleExe()
	if _, e := RunHidden(exe, "funnel", "--bg", "--yes", "5055"); e == nil {
		return nil
	}
	_, e := RunHidden(exe, "funnel", "--bg", "5055")
	return e
}

func TailscalePublicURL() string {
	out, e := RunHidden(tailscaleExe(), "status", "--json")
	if e != nil || strings.TrimSpace(out) == "" {
		return ""
	}
	var st struct {
		Self struct {
			DNSName string `json:"DNSName"`
		} `json:"Self"`
	}
	if json.Unmarshal([]byte(out), &st) != nil {
		return ""
	}
	dns := strings.TrimSpace(strings.TrimSuffix(st.Self.DNSName, "."))
	if dns == "" {
		return ""
	}
	return "https://" + dns
}
'''
          s=s[:start]+replacement+s[end:]
          core.write_text(s,encoding='utf-8')

          agent=Path('/tmp/gat-src/cmd/agent/main.go')
          t=agent.read_text(encoding='utf-8')
          marker='\ta.refreshStatus()\n\tgo a.pollLoop()'
          if marker not in t:
              raise SystemExit('agent startup marker not found')
          t=t.replace(marker,'\ta.refreshStatus()\n\tgo a.ensureFunnel()\n\tgo a.pollLoop()',1)
          insert='''
func (a *agent) ensureFunnel() {
	if err := core.StartFunnel(); err != nil {
		core.AppendLog("Funnel 5055 nao ativado: %v", err)
		return
	}
	if u := core.TailscalePublicURL(); u != "" {
		a.mu.Lock()
		a.cfg.FunnelURL = u
		c := a.cfg
		a.mu.Unlock()
		_ = core.SaveConfig(c)
	}
	a.refreshStatus()
	core.AppendLog("Funnel 5055 ativo: %s", a.cfg.FunnelURL)
}

'''
          pos=t.index('func (a *agent) wrap(')
          t=t[:pos]+insert+t[pos:]
          agent.write_text(t,encoding='utf-8')
          PY
          cd /tmp/gat-src
          gofmt -w internal/core/core.go cmd/agent/main.go
          grep -n 'InternalVersion' internal/core/core.go | head
          grep -n 'TelemetryPath' internal/core/core.go | head
          grep -n -A35 'func StartFunnel' internal/core/core.go | head -n 45
          grep -n -A20 'ensureFunnel' cmd/agent/main.go | head -n 35

      - name: Build Windows agent
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gat-src
          mkdir -p /tmp/dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/dist/GAT_LOG_AGENT.exe ./cmd/agent
          sha256sum /tmp/dist/GAT_LOG_AGENT.exe

      - name: Build updater
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/updater/assets
          cp /tmp/dist/GAT_LOG_AGENT.exe /tmp/updater/assets/GAT_LOG_AGENT.exe
          cat > /tmp/updater/go.mod <<'EOF'
          module gatlogupdater014
          go 1.23
          EOF
          cat > /tmp/updater/main.go <<'EOF'
          package main

          import (
            "bytes"
            "embed"
            "fmt"
            "os"
            "os/exec"
            "path/filepath"
            "syscall"
            "time"
            "unsafe"
          )

          //go:embed assets/GAT_LOG_AGENT.exe
          var payload embed.FS

          var user32 = syscall.NewLazyDLL("user32.dll")
          var messageBoxW = user32.NewProc("MessageBoxW")
          const ( MB_OK=0x0; MB_ICONINFORMATION=0x40; MB_ICONERROR=0x10 )
          func u16(s string)*uint16{p,_:=syscall.UTF16PtrFromString(s);return p}
          func msg(s string,f uintptr){messageBoxW.Call(0,uintptr(unsafe.Pointer(u16(s))),uintptr(unsafe.Pointer(u16("GAT-LOG | Atualização 0.1.4"))),f)}
          func lad()string{if v:=os.Getenv("LOCALAPPDATA");v!=""{return v};h,_:=os.UserHomeDir();return filepath.Join(h,"AppData","Local")}
          func cmd(n string,a ...string)*exec.Cmd{c:=exec.Command(n,a...);c.SysProcAttr=&syscall.SysProcAttr{HideWindow:true};return c}
          func kill(n string){_ = cmd("taskkill.exe","/F","/IM",n).Run()}
          func backup(p,d string){b,e:=os.ReadFile(p);if e!=nil{return};_ = os.MkdirAll(d,0755);_ = os.WriteFile(filepath.Join(d,filepath.Base(p)),b,0755)}
          func atomic(p string,b []byte)error{t:=p+".new";_ = os.Remove(t);if e:=os.WriteFile(t,b,0755);e!=nil{return e};_ = os.Remove(p);return os.Rename(t,p)}
          func launch(p string){c:=exec.Command(p);c.Dir=filepath.Dir(p);c.SysProcAttr=&syscall.SysProcAttr{HideWindow:true};_ = c.Start()}
          func patchUI(p string) error {
            b,e:=os.ReadFile(p);if e!=nil{return e}
            b=bytes.ReplaceAll(b,[]byte("0.1.2"),[]byte("0.1.4"))
            b=bytes.ReplaceAll(b,[]byte("0.1.3"),[]byte("0.1.4"))
            return atomic(p,b)
          }
          func migrateTelemetry(){
            root:=filepath.Join(lad(),"GAT-LOG")
            dst:=filepath.Join(root,"telemetry.json")
            if _,e:=os.Stat(dst);e==nil{return}
            src:=filepath.Join(root,"telemetry","current.json")
            if b,e:=os.ReadFile(src);e==nil{_ = os.WriteFile(dst,b,0644)}
          }
          func main(){
            install:=filepath.Join(lad(),"Programs","GAT-LOG Server")
            _ = os.MkdirAll(install,0755)
            sp:=filepath.Join(install,"GAT_LOG_SERVER.exe"); ap:=filepath.Join(install,"GAT_LOG_AGENT.exe")
            kill("GAT_LOG_SERVER.exe");kill("GAT_LOG_AGENT.exe");time.Sleep(900*time.Millisecond)
            bd:=filepath.Join(install,"backup_antes_0.1.4");backup(sp,bd);backup(ap,bd)
            if e:=patchUI(sp);e!=nil{msg("Falha ao atualizar a identificação da interface:\r\n"+e.Error(),MB_OK|MB_ICONERROR);return}
            a,e:=payload.ReadFile("assets/GAT_LOG_AGENT.exe");if e!=nil{msg(e.Error(),MB_OK|MB_ICONERROR);return}
            if e=atomic(ap,a);e!=nil{msg("Falha ao atualizar o agente:\r\n"+e.Error(),MB_OK|MB_ICONERROR);return}
            migrateTelemetry()
            launch(ap);time.Sleep(1300*time.Millisecond);launch(sp)
            msg(fmt.Sprintf("GAT-LOG Server 0.1.4 instalado.\r\n\r\n• telemetria corrigida na interface nativa;\r\n• Funnel 5055 iniciado automaticamente;\r\n• contagem duplicada de jogador corrigida;\r\n• configurações, mods, moderador e histórico preservados.\r\n\r\nO servidor ETS2 permaneceu aberto."),MB_OK|MB_ICONINFORMATION)
          }
          EOF
          cd /tmp/updater
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/dist/GAT_LOG_SERVER_UPDATE_0.1.4.exe .
          sha256sum /tmp/dist/GAT_LOG_SERVER_UPDATE_0.1.4.exe
          ls -lh /tmp/dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: gat-log-server-update-0.1.4-test
          path: /tmp/dist/*.exe
          retention-days: 7
