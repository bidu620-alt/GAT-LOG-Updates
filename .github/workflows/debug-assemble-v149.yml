name: Temp assemble local runtime for v1.49
on:
  push:
    branches: [career-history-v149-20260903]
    paths: ['server-local/debug-assemble-trigger.txt']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply career site, release workflow and assemble exact current runtime
        run: |
          python server-local/apply-v149-site-career.py
          python server-local/apply-v149-site-copy.py
          python server-local/prepare-v149-release.py
          node --check docs/driver-gamification.js
          node --check docs/motorista-enhancements.js
          node --check docs/work-catalog-completion.js
          node --check docs/work-catalog.js
          node --check docs/work-rule-final.js
          python server-local/build-api.py
          python server-local/apply-admin-work-switch.py
          python server-local/apply-auto-classification.py server-local/runtime/worker.js
          python server-local/apply-auto-classification-safety.py server-local/runtime/worker.js
          python server-local/apply-trip-state-machine.py server-local/runtime/worker.js
          python server-local/apply-rank-startup-grace.py server-local/runtime/worker.js
          python server-local/apply-v147-lapeal-rank-fix.py server-local/runtime
          python server-local/apply-v148-jeanjc-rank-fix.py server-local/runtime
          python server-local/normalize-go-live.py
          python server-local/apply-monthly-trip-goal.py server-local/runtime/worker.js
          python server-local/apply-v149-career-history.py server-local/runtime
          node --check server-local/runtime/worker.js
          node --check server-local/runtime/host.mjs
          node --test --test-timeout=30000 server-local/career-history-v149.test.mjs
          cp server-local/runtime/worker.js server-local/debug-runtime-worker.js
          cp server-local/runtime/host.mjs server-local/debug-runtime-host.mjs
      - name: Commit validated sources and debug runtime
        run: |
          git config user.name 'GAT Debug Build'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/build-server-local.yml docs/driver-gamification.js docs/motorista-enhancements.js docs/work-catalog-completion.js docs/motorista.html docs/work-catalog.js docs/work-rule-final.js server-local/debug-runtime-worker.js server-local/debug-runtime-host.mjs
          git diff --cached --quiet || git commit -m 'Validate complete GAT 1.0.49 career release sources'
          git push
