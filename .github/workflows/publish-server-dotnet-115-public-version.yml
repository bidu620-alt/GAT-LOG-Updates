name: Publish GAT-LOG Server DotNet 1.0.15 Public Version

on:
  push:
    branches: [server-dotnet-winforms]
    paths:
      - 'server-dotnet/publish-1.0.15-public-version.txt'

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: server-dotnet-winforms
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Build Go agent 1.0.15
        shell: bash
        run: |
          set +e
          rm -rf /tmp/gat-src && mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          set -e
          python3 server-native-0.1/build015/apply_015.py
          python3 server-native-0.1/build015/fix_check_update.py
          python3 server-native-0.1/build017/apply_017.py
          python3 server-dotnet/build101/apply_101_moderator.py
          python3 server-dotnet/build103/apply_103_telemetry.py
          python3 server-dotnet/build104/apply_104_speed_units.py
          python3 server-dotnet/build105/apply_105_truck_speed_kmh.py
          python3 server-dotnet/build107/apply_107_server_config.py
          python3 server-dotnet/build108/apply_108_hide_server_console.py
          python3 server-dotnet/build110/apply_110_public_live.py
          python3 server-dotnet/build112/apply_112_driver_accounts.py
          python3 server-dotnet/build113/apply_113_driver_history_missions.py
          python3 server-dotnet/build114/apply_114_account_cors.py
          python3 server-dotnet/build115/apply_115_public_version.py
          cd /tmp/gat-src
          gofmt -w cmd/agent/main.go internal/core/core.go
          grep -q 'InternalVersion = "1.0.15"' internal/core/core.go
          grep -q '/api/public/version' cmd/agent/main.go
          grep -q 'publicRanking(w http.ResponseWriter' cmd/agent/main.go
          mkdir -p "$GITHUB_WORKSPACE/agent-out"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-H=windowsgui -s -w' -o "$GITHUB_WORKSPACE/agent-out/GAT_LOG_AGENT.exe" ./cmd/agent
          test -s "$GITHUB_WORKSPACE/agent-out/GAT_LOG_AGENT.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-agent-115
          path: agent-out/GAT_LOG_AGENT.exe
          retention-days: 2

  publish:
    needs: agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: server-dotnet-winforms
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: dotnet-agent-115
          path: server-dotnet/GatLogInstaller/payload

      - name: Reuse red GAT SERVER icon
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'GAT_SERVER_ICON.exe'
          Invoke-WebRequest 'https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_LOG_SERVER_DOTNET_UPDATE_1.0.14_TESTE.exe' -OutFile $src
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($src)
          if ($null -eq $icon) { throw 'Não foi possível extrair o ícone vermelho.' }
          $paths = @('server-dotnet/GatLogServer/assets/GAT_SERVER.ico','server-dotnet/GatLogInstaller/assets/GAT_SERVER.ico')
          foreach ($p in $paths) {
            New-Item -ItemType Directory -Force (Split-Path $p -Parent) | Out-Null
            $fs=[System.IO.File]::Create($p); try {$icon.Save($fs)} finally {$fs.Dispose()}
          }
          $icon.Dispose()

      - name: Mark Server as 1.0.15 preserving UI
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          ui=Path('server-dotnet/GatLogServer/MainForm.cs')
          s=ui.read_text(encoding='utf-8')
          s=s.replace('CurrentVersion = "1.0.0"','CurrentVersion = "1.0.15"')
          s=s.replace('GAT-LOG SERVER 1.0 | ETS2 + Telemetria','GAT-LOG SERVER 1.0.15 | ETS2 + Telemetria')
          s=s.replace('C# WinForms 1.0.0','C# WinForms 1.0.15')
          s=s.replace('Interval = 3000','Interval = 1000')
          if 'ExtractAssociatedIcon' not in s:
              s=s.replace('DoubleBuffered = true;','DoubleBuffered = true;\n            Icon = Icon.ExtractAssociatedIcon(Application.ExecutablePath);',1)
          ui.write_text(s,encoding='utf-8')

          proj=Path('server-dotnet/GatLogServer/GatLogServer.csproj')
          p=proj.read_text(encoding='utf-8')
          p=p.replace('<Version>1.0.0.0</Version>','<Version>1.0.15.0</Version>')
          p=p.replace('<FileVersion>1.0.0.0</FileVersion>','<FileVersion>1.0.15.0</FileVersion>')
          p=p.replace('<AssemblyVersion>1.0.0.0</AssemblyVersion>','<AssemblyVersion>1.0.15.0</AssemblyVersion>')
          if '<ApplicationIcon>' not in p:
              p=p.replace('<ApplicationManifest>app.manifest</ApplicationManifest>','<ApplicationManifest>app.manifest</ApplicationManifest>\n    <ApplicationIcon>assets\\GAT_SERVER.ico</ApplicationIcon>',1)
          proj.write_text(p,encoding='utf-8')

          ip=Path('server-dotnet/GatLogInstaller/Program.cs')
          x=ip.read_text(encoding='utf-8')
          if 'using System.Runtime.InteropServices;' not in x:
              x=x.replace('using System.Reflection;','using System.Reflection;\nusing System.Runtime.InteropServices;',1)
          x=x.replace('Instalar GAT-LOG Server C# 1.0.0 TESTE?','Atualizar GAT-LOG Server C# para 1.0.15?')
          x=x.replace('GAT-LOG Server C# 1.0.0 TESTE instalado.','GAT-LOG Server C# 1.0.15 atualizado.')
          marker='internal static class Program\n    {'
          if 'SHChangeNotify' not in x:
              x=x.replace(marker,marker+'\n        [DllImport("shell32.dll")]\n        private static extern void SHChangeNotify(uint wEventId, uint uFlags, IntPtr dwItem1, IntPtr dwItem2);',1)
          if 'shortcut.IconLocation' not in x:
              x=x.replace('shortcut.Description = "GAT-LOG Server";','shortcut.Description = "GAT-LOG Server";\n            shortcut.IconLocation = targetPath + ",0";',1)
          call='CreateShortcut(Path.Combine(StartMenu, "GAT-LOG Server.lnk"), Path.Combine(InstallDir, "GAT_LOG_SERVER.exe"));'
          if 'SHChangeNotify(0x08000000' not in x:
              x=x.replace(call,call+'\n                SHChangeNotify(0x08000000, 0x0000, IntPtr.Zero, IntPtr.Zero);',1)
          ip.write_text(x,encoding='utf-8')

          iproj=Path('server-dotnet/GatLogInstaller/GatLogInstaller.csproj')
          q=iproj.read_text(encoding='utf-8')
          q=q.replace('GAT_LOG_SERVER_DOTNET_SETUP_1.0.0_TESTE','GAT_LOG_SERVER_DOTNET_UPDATE_1.0.15_TESTE')
          if '<ApplicationIcon>' not in q:
              q=q.replace('<ApplicationManifest>app.manifest</ApplicationManifest>','<ApplicationManifest>app.manifest</ApplicationManifest>\n    <ApplicationIcon>assets\\GAT_SERVER.ico</ApplicationIcon>',1)
          iproj.write_text(q,encoding='utf-8')
          '@ | Set-Content "$env:RUNNER_TEMP\patch_server_115.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\patch_server_115.py"

      - name: Build CSharp server
        shell: pwsh
        run: |
          dotnet restore server-dotnet/GatLogServer/GatLogServer.csproj
          dotnet build server-dotnet/GatLogServer/GatLogServer.csproj -c Release --no-restore

      - name: Prepare updater payload
        shell: pwsh
        run: |
          $out='server-dotnet/GatLogServer/bin/Release/net48'
          $pay='server-dotnet/GatLogInstaller/payload'
          New-Item -ItemType Directory -Force "$pay/assets" | Out-Null
          Copy-Item "$out/GAT_LOG_SERVER.exe" "$pay/GAT_LOG_SERVER.exe" -Force
          Copy-Item "$out/GAT_LOG_SERVER.exe.config" "$pay/GAT_LOG_SERVER.exe.config" -Force
          Copy-Item "$out/Newtonsoft.Json.dll" "$pay/Newtonsoft.Json.dll" -Force
          Copy-Item 'server-native-0.1/assets/logo.png' "$pay/assets/logo.png" -Force
          Copy-Item 'server-native-0.1/assets/banner.png' "$pay/assets/banner.png" -Force
          if (-not (Test-Path "$pay/GAT_LOG_AGENT.exe")) { throw 'Agente 1.0.15 ausente.' }

      - name: Build updater
        shell: pwsh
        run: |
          dotnet restore server-dotnet/GatLogInstaller/GatLogInstaller.csproj
          dotnet build server-dotnet/GatLogInstaller/GatLogInstaller.csproj -c Release --no-restore
          $update='server-dotnet/GatLogInstaller/bin/Release/net48/GAT_LOG_SERVER_DOTNET_UPDATE_1.0.15_TESTE.exe'
          if (-not (Test-Path $update)) { throw 'Atualizador 1.0.15 não foi gerado.' }
          Copy-Item $update "$env:RUNNER_TEMP/GAT_LOG_SERVER_DOTNET_UPDATE_1.0.15_TESTE.exe" -Force

      - name: Publish updater and manifest to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard HEAD
          git clean -fdx
          git checkout -B main origin/main
          mkdir -p releases
          cp "$RUNNER_TEMP/GAT_LOG_SERVER_DOTNET_UPDATE_1.0.15_TESTE.exe" releases/GAT_LOG_SERVER_DOTNET_UPDATE_1.0.15_TESTE.exe
          SHA=$(sha256sum releases/GAT_LOG_SERVER_DOTNET_UPDATE_1.0.15_TESTE.exe | awk '{print $1}')
          cat > server_dotnet_version.json <<EOF
          {
            "app": "GAT-LOG Server CSharp",
            "channel": "test-dotnet",
            "version": "1.0.15",
            "display_version": "1.0.15 TESTE",
            "notas": "Adiciona diagnóstico da versão real do agente, libera CORS também para ranking e perfil público e mantém histórico, 40 missões e trabalho atual. O site passa a identificar diretamente qual agente está respondendo.",
            "setup_url": "https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_LOG_SERVER_DOTNET_UPDATE_1.0.15_TESTE.exe",
            "sha256": "$SHA"
          }
          EOF
          git add releases/GAT_LOG_SERVER_DOTNET_UPDATE_1.0.15_TESTE.exe server_dotnet_version.json
          git commit -m "Publica GAT-LOG Server 1.0.15 com versão real do agente"
          git push origin main
