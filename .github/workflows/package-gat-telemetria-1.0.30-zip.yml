name: Package GAT Telemetria 1.0.30 ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gat-telemetria-allinone-1.0.29/zip-trigger.txt'
      - '.github/workflows/package-gat-telemetria-1.0.30-zip.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar ZIP da Telemetria 1.0.30
        shell: powershell
        run: |
          $exe = 'releases/GAT_TELEMETRIA_SETUP_1.0.30.exe'
          $zip = 'releases/GAT_TELEMETRIA_1.0.30.zip'
          if (-not (Test-Path $exe)) { throw 'GAT_TELEMETRIA_SETUP_1.0.30.exe nao encontrado' }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $exe -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw 'Falha ao criar ZIP' }
      - name: Publicar ZIP
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/GAT_TELEMETRIA_1.0.30.zip
          git commit -m "Publica GAT Telemetria 1.0.30 em ZIP"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar commit do ZIP' }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao sincronizar antes da publicacao' }
          git push
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar ZIP' }
