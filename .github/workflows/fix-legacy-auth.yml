name: Fix legacy account authentication

on:
  push:
    branches: [main]
    paths: ['legacy-auth-trigger.txt']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Worker legacy password compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cloudflare-central/worker.js')
          s = p.read_text(encoding='utf-8')
          old_hash = "async function passHash(password,salt){return bytesToHex(pbkdf2(sha256,enc.encode(String(password)),enc.encode(String(salt)),{c:140000,dkLen:32}))}"
          new_hash = """async function passHash(password,salt){return bytesToHex(pbkdf2(sha256,enc.encode(String(password)),enc.encode(String(salt)),{c:140000,dkLen:32}))}\n// Legacy GAT Server accounts used 120,000 consecutive SHA-256 rounds over salt + NUL + password.\nfunction legacyPassHash(password,salt){let x=enc.encode(String(salt)+'\\x00'+String(password));for(let i=0;i<120000;i++)x=sha256(x);return bytesToHex(x)}\nasync function verifyPassword(env,account,password){if(!account?.password_hash||!account?.password_salt)return false;const current=await passHash(password,account.password_salt);if(await equal(current,account.password_hash))return true;const legacy=legacyPassHash(password,account.password_salt);if(!(await equal(legacy,account.password_hash)))return false;const salt=randomHex(16),hash=await passHash(password,salt);await env.DB.prepare('UPDATE accounts SET password_salt=?,password_hash=?,updated_at=? WHERE user=?').bind(salt,hash,now(),account.user).run();return true}"""
          if 'function legacyPassHash(' not in s:
              if old_hash not in s:
                  raise SystemExit('passHash marker not found')
              s = s.replace(old_hash, new_hash, 1)
          old_login = "const a=await env.DB.prepare('SELECT * FROM accounts WHERE user=?').bind(user).first(),candidate=a?.password_hash?await passHash(String(b.password||''),a.password_salt):randomHex(32),valid=!!a&&!a.disabled&&!!a.password_hash&&await equal(candidate,a.password_hash);"
          new_login = "const a=await env.DB.prepare('SELECT * FROM accounts WHERE user=?').bind(user).first(),valid=!!a&&!a.disabled&&!!a.password_hash&&await verifyPassword(env,a,String(b.password||''));"
          if old_login in s:
              s = s.replace(old_login, new_login, 1)
          elif 'await verifyPassword(env,a,' not in s:
              raise SystemExit('login marker not found')
          p.write_text(s, encoding='utf-8')
          PY
          node --check cloudflare-central/worker.js
          git diff --check
          git diff -- cloudflare-central/worker.js
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- cloudflare-central/worker.js; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-central/worker.js
          git commit -m 'Restore legacy account password compatibility'
          git push origin HEAD:main
