name: Inspect native UI freeze

on:
  push:
    branches: [main]
    paths:
      - 'server-native-0.1/inspect-ui-freeze.txt'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover current native source
        shell: bash
        run: |
          set +e
          rm -rf /tmp/gat-src && mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          set -e
          python3 server-native-0.1/build015/apply_015.py
          python3 server-native-0.1/build015/fix_check_update.py
          cd /tmp/gat-src
          gofmt -w cmd/ui/main.go cmd/agent/main.go internal/core/core.go
      - name: Show critical UI code
        shell: bash
        run: |
          set +e
          echo '=== UI click/login ==='
          sed -n '800,990p' /tmp/gat-src/cmd/ui/main.go
          echo '=== API helpers ==='
          sed -n '970,1065p' /tmp/gat-src/cmd/ui/main.go
          echo '=== agent status/poll ==='
          grep -n -A220 -B30 -E '^func \(a \*agent\) pollLoop|^func \(a \*agent\) refreshStatus|^func \(a \*agent\) uiStatus|^func \(a \*agent\) uiConfig' /tmp/gat-src/cmd/agent/main.go | head -n 3500
          exit 0
