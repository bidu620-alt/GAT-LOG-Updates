name: Inspect native UI freeze

on:
  push:
    branches: [main]
    paths:
      - 'server-native-0.1/inspect-ui-freeze.txt'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover current native source
        shell: bash
        run: |
          set +e
          rm -rf /tmp/gat-src && mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          set -e
          python3 server-native-0.1/build015/apply_015.py
          python3 server-native-0.1/build015/fix_check_update.py
          cd /tmp/gat-src
          gofmt -w cmd/ui/main.go cmd/agent/main.go internal/core/core.go
      - name: Show log parsing code
        shell: bash
        run: |
          set +e
          echo '=== ParseSession ==='
          grep -n -A260 -B30 -E '^func ParseSession|^func ServerLogPath|^func PackagesStatus|^func ContainsPlayer' /tmp/gat-src/internal/core/core.go | head -n 5000
          echo '=== file reads in core ==='
          grep -n -E 'ReadFile|Open\(|ReadAll|Scanner|server.log|Seek\(' /tmp/gat-src/internal/core/core.go | head -n 1000
          exit 0
