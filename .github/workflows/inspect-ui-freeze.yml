name: Inspect native UI freeze

on:
  push:
    branches: [main]
    paths:
      - 'server-native-0.1/inspect-ui-freeze.txt'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover current native source
        shell: bash
        run: |
          set +e
          rm -rf /tmp/gat-src && mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          set -e
          python3 server-native-0.1/build015/apply_015.py
          python3 server-native-0.1/build015/fix_check_update.py
          python3 server-native-0.1/build017/apply_017.py
          cd /tmp/gat-src
          gofmt -w cmd/ui/main.go cmd/agent/main.go internal/core/core.go
      - name: Show install/data path code
        shell: bash
        run: |
          set +e
          echo '=== InstallDir/DataDir ==='
          grep -n -A100 -B30 -E '^func InstallDir|^func DataDir|^func ConfigPath|^func EnsureDataDirs' /tmp/gat-src/internal/core/core.go | head -n 2500
          echo '=== install dir usages ==='
          grep -R -n 'InstallDir()\|Programs.*GAT-LOG Server\|LOCALAPPDATA' /tmp/gat-src | head -n 2000
          exit 0
