name: Inspect Server Native Source

on:
  push:
    paths:
      - 'server-native-0.1/inspect.txt'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          cat server-native-0.1/source.part.* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.gz
          gzip -dc /tmp/source.gz > /tmp/source.dec
          echo '--- FILE ---'
          file /tmp/source.dec
          wc -c /tmp/source.dec
          echo '--- HEAD ---'
          head -50 /tmp/source.dec
          echo '--- KEY SYMBOLS ---'
          grep -nE 'func main|agent|setup|remaining_km|distance_m|speed_kmh|truck.speed|http.Client|WM_TIMER|SetTimer|refresh|telemetry' /tmp/source.dec | head -250 || true
