name: Inspect live GAT Central
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-live-gat-central.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public live/profile/ranking safely
        shell: python
        run: |
          import json, urllib.request, urllib.error
          base='https://api.gatlogets2.com.br'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'GAT-Live-Diagnostic/1.0','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  try: body=json.loads(e.read().decode())
                  except: body={'error':'http_'+str(e.code)}
                  return e.code,body
              except Exception as e:
                  return 0,{'error':type(e).__name__+': '+str(e)}
          for path in ['/health','/api/public/driver?user=biduzao','/api/public/account-live','/api/public/ranking']:
              status,data=get(path)
              print('\n===',path,'HTTP',status,'===')
              if path=='/health':
                  print(json.dumps(data,ensure_ascii=False,indent=2))
              elif path.startswith('/api/public/driver'):
                  p=(data or {}).get('profile') or {}
                  m=p.get('current_mission') or {}
                  print(json.dumps({
                    'ok':data.get('ok'),'user':p.get('user'),'monthly_completed':p.get('monthly_completed'),
                    'total_deliveries':p.get('total_deliveries'),'xp':p.get('xp'),'points':p.get('points'),
                    'mission':{k:m.get(k) for k in ['id','sequence','title','state','min_km','cargo','source','destination','planned_distance_km','trip_progress_confirmed','rank_guard','last_rejected_reason','last_rejected_at','last_distance_km']},
                    'last_deliveries':[{k:d.get(k) for k in ['id','sequence','cargo','source','destination','distance_km','xp','gat_points','delivered_at','rank_verified','rank_client_version']} for d in (p.get('deliveries') or [])[-5:]
                  },ensure_ascii=False,indent=2))
              elif path=='/api/public/account-live':
                  rows=[]
                  for x in (data or {}).get('telemetry') or []:
                      if str(x.get('account_user','')).lower()!='biduzao': continue
                      raw=x.get('telemetry') or {}
                      rows.append({
                        'driver':x.get('driver'),'account_user':x.get('account_user'),'updated_at':x.get('updated_at'),'rank_status':x.get('rank_status'),
                        'on_job':x.get('on_job'),'cargo_name':x.get('cargo_name'),'source_city':x.get('source_city'),'destination_city':x.get('destination_city'),'mass_kg':x.get('mass_kg'),'remaining_km':x.get('remaining_km'),
                        'gat_client_version':raw.get('gat_client_version'),'gat_packet_id':raw.get('gat_packet_id'),'gat_collected_at':raw.get('gat_collected_at'),'gat_job_event':raw.get('gat_job_event'),'job_latched':raw.get('job_latched'),'job_latch_key':raw.get('job_latch_key'),
                        'damage':{k:raw.get(k) for k in ['cargo_damage_pct','truck_engine_damage_pct','truck_transmission_damage_pct','truck_cabin_damage_pct','truck_chassis_damage_pct','truck_wheels_damage_pct','trailer_damage_pct']}
                      })
                  print(json.dumps({'ok':data.get('ok'),'rows':rows},ensure_ascii=False,indent=2))
              else:
                  rows=[x for x in (data or {}).get('ranking') or [] if str(x.get('user','')).lower()=='biduzao']
                  print(json.dumps({'ok':data.get('ok'),'biduzao':rows},ensure_ascii=False,indent=2))
