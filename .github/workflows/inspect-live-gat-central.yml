name: Inspect live GAT Central
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-live-gat-central.yml']
permissions:
  contents: read
# Diagnóstico 2026-09-04: status ONLINE de Xuxa/EduardoVidal/JeanJC e entrega Chocolate do JeanJC.
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public live/profile/ranking safely
        shell: python
        run: |
          import json, urllib.request, urllib.error, datetime
          base='https://api.gatlogets2.com.br'
          users=['xuxa','eduardovidal','jeanjc']
          def request(path,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=data,method=method,headers={'User-Agent':'GAT-Live-Diagnostic/1.0','Cache-Control':'no-cache','Content-Type':'text/plain;charset=UTF-8'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  try: body=json.loads(e.read().decode())
                  except: body={'error':'http_'+str(e.code)}
                  return e.code,body
              except Exception as e:
                  return 0,{'error':type(e).__name__+': '+str(e)}

          status,health=request('/health')
          print('\n=== HEALTH HTTP',status,'===')
          print(json.dumps(health,ensure_ascii=False,indent=2))

          status,live=request('/api/public/account-live')
          print('\n=== ACCOUNT LIVE HTTP',status,'===')
          rows=[]
          for x in (live or {}).get('telemetry') or []:
              u=str(x.get('account_user') or x.get('driver') or '').lower()
              if u not in users: continue
              raw=x.get('telemetry') or {}
              rows.append({
                'driver':x.get('driver'),'account_user':x.get('account_user'),'updated_at':x.get('updated_at'),'rank_status':x.get('rank_status'),
                'on_job':x.get('on_job'),'cargo_name':x.get('cargo_name'),'source_city':x.get('source_city'),'destination_city':x.get('destination_city'),
                'mass_kg':x.get('mass_kg'),'remaining_km':x.get('remaining_km'),'speed_kmh':x.get('speed_kmh'),
                'gat_client_version':raw.get('gat_client_version'),'gat_packet_id':raw.get('gat_packet_id'),'gat_collected_at':raw.get('gat_collected_at'),
                'gat_trip_id':raw.get('gat_trip_id'),'gat_map':raw.get('gat_map'),'game_name':raw.get('game_name') or raw.get('gameName')
              })
          print(json.dumps({'ok':(live or {}).get('ok'),'server_now_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'rows':rows},ensure_ascii=False,indent=2))

          for user in users:
              status,data=request('/api/public/driver?user='+user)
              print('\n=== DRIVER',user,'HTTP',status,'===')
              p=(data or {}).get('profile') or {}
              deliveries=p.get('deliveries') or []
              print(json.dumps({
                'ok':(data or {}).get('ok'),'user':p.get('user'),'last_telemetry_at':p.get('last_telemetry_at'),
                'total_deliveries':p.get('total_deliveries'),'total_km':p.get('total_km'),'xp':p.get('xp'),'points':p.get('points'),
                'current_mission':p.get('current_mission'),
                'last_deliveries':[{k:d.get(k) for k in ['id','sequence','cargo','source','destination','distance_km','xp_awarded','gat_points','completed_at','delivered_at','ranking_reason','automatic_ranking_reason']} for d in deliveries[-8:]],
                'chocolate_matches':[{k:d.get(k) for k in ['id','sequence','cargo','source','destination','distance_km','xp_awarded','gat_points','completed_at','delivered_at','ranking_reason']} for d in deliveries if 'chocol' in str(d.get('cargo','')).lower()]
              },ensure_ascii=False,indent=2))

          status,ranking=request('/api/public/ranking')
          print('\n=== RANKING HTTP',status,'===')
          r=[x for x in (ranking or {}).get('ranking') or [] if str(x.get('user','')).lower() in users]
          print(json.dumps(r,ensure_ascii=False,indent=2))
