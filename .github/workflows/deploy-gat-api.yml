name: Deploy GAT API

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-central/**"
      - ".github/workflows/deploy-gat-api.yml"
  workflow_dispatch:

concurrency:
  group: gat-log-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare-central
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloudflare-central/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: python scripts/apply-stable-job-labels.py
      - run: python scripts/apply-cargo-id-validation.py
      - run: python scripts/apply-base-distance-fallback.py
      - run: python scripts/apply-telemetry-aliases.py
      - run: python scripts/apply-simple-job-validation.py
      - run: python scripts/apply-gat-points.py
      - run: python scripts/apply-delivery-progress-guard.py
      - run: python scripts/apply-repeat-xp-only.py
      - run: python scripts/apply-truck-damage.py
      - run: python scripts/apply-site-notice.py
      - run: python scripts/apply-profile-avatar.py
      - run: python scripts/apply-ranking-telemetry.py
      - run: python scripts/apply-d1-savings.py
      - run: node --test tests/*.test.mjs
      - run: pnpm run check
      - name: Inspect free-tier usage without D1 queries
        continue-on-error: true
        run: python scripts/inspect-d1-usage.py
      - run: pnpm run migrate:remote
      - run: pnpm run sync:cargos
      - run: pnpm run deploy
      - name: Refresh free-tier budget protection
        run: python scripts/inspect-d1-usage.py --enforce
      - name: Verify deployed API version
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          endpoint='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/scripts/gat-log-api'
          request=urllib.request.Request(endpoint,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(request,timeout=30) as response:
              deployed=response.read().decode('utf-8')
          for marker in ['1.0.52-cloudflare','free_tier_protection','damage_data_incomplete','GAT_D1_BUDGET']:
              assert marker in deployed, 'Missing deployed protection: '+marker
          print('Verified deployed Worker content: 1.0.52, damage validation and free-tier protection.')
          try:
              request=urllib.request.Request('https://api.gatlogets2.com.br/health',headers={'User-Agent':'GAT-Deployment-Check/1.0'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  data=json.load(response)
              print(json.dumps(data))
              assert data.get('agent_version') == '1.0.52-cloudflare'
          except urllib.error.HTTPError as error:
              if error.code!=403: raise
              print('::warning::Public health check denied HTTP 403 from CI; deployed source verified through authenticated Cloudflare API.')
          PY

# Validacao simples: trabalho ativo + carga detectada + peso > 0 + distancia minima.
# Entrega so conclui apos o evento ser armado e haver pelo menos 1 km de progresso real.
# Pontos GAT: cada primeira conclusao valida do trabalho comeca em 100 pontos; multas e danos descontam.
# Dano novo do caminhao: maior aumento entre motor/cambio/cabine/chassi/rodas; nunca soma porcentagens.
# Ranking oficial: maior total de Pontos GAT do mes, mantendo x/30 como progresso.
# Trabalho ja concluido no mes pode ser repetido: a nova viagem soma somente XP ao nivel.
# Avisos: admins podem publicar/desativar aviso persistente exibido na tela inicial.
# Avatar: foto do perfil reduzida no navegador e salva no perfil do motorista.
