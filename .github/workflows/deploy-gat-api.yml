name: Deploy GAT API

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-central/**"
      - ".github/workflows/deploy-gat-api.yml"
  workflow_dispatch:

concurrency:
  group: gat-log-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare-central
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloudflare-central/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: python scripts/apply-stable-job-labels.py
      - run: python scripts/apply-cargo-id-validation.py
      - run: python scripts/apply-base-distance-fallback.py
      - run: python scripts/apply-simple-job-validation.py
      - run: pnpm run check
      - run: pnpm run migrate:remote
      - run: pnpm run sync:cargos
      - run: pnpm run deploy

# Validacao simples: trabalho ativo + carga detectada + peso > 0 + distancia minima.
# Catalogo, cargoId e cidades ficam para organizacao/exibicao e nao bloqueiam o trabalho.
