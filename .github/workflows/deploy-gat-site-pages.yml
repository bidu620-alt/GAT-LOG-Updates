name: Deploy GAT LOG Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/apply-profile-avatar-site.py'
      - 'scripts/apply-radio-admin-site.py'
      - '.github/workflows/deploy-gat-site-pages.yml'
      - 'scripts/update-streamer-status.mjs'
      - 'scripts/test-streamer-status.mjs'
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply profile avatar UI
        run: python scripts/apply-profile-avatar-site.py

      - name: Add Radio GAT admin navigation
        run: python scripts/apply-radio-admin-site.py

      - name: Validate Radio GAT site files
        run: |
          node --check docs/radio-admin.js
          grep -q 'radio-admin.html' docs/admin.html
          grep -q 'site não reproduz áudio' docs/radio-admin.html

      - name: Validate game cargo names and IDs
        run: node scripts/test-cargo-identity.cjs

      - name: Validate Special Transport event and achievement
        run: node scripts/test-special-transport.cjs

      - name: Validate live stream directory
        run: |
          node --check docs/streamers-home.js
          node scripts/test-streamer-status.mjs

      - name: Refresh public stream status
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: node scripts/update-streamer-status.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
