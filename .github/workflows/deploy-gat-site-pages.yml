name: Deploy GAT LOG Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/apply-profile-avatar-site.py'
      - 'scripts/apply-radio-admin-site.py'
      - '.github/workflows/deploy-gat-site-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply profile avatar UI
        run: python scripts/apply-profile-avatar-site.py

      - name: Add Radio GAT admin navigation
        run: python scripts/apply-radio-admin-site.py

      - name: Validate Radio GAT site files
        run: |
          node --check docs/radio-admin.js
          grep -q 'radio-admin.html' docs/admin.html
          grep -q 'site não reproduz áudio' docs/radio-admin.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
