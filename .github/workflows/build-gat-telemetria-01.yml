name: Build GAT Telemetria 0.1

on:
  push:
    paths:
      - 'native-0.1/trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Rebuild source files
        shell: bash
        run: |
          if [ ! -f native-0.1/main.go ]; then
            cat native-0.1/main.part.* > native-0.1/main.go
          fi
          cat native-0.1/assets.part.* > native-0.1/assets.go

      - name: Apply GAT Telemetria 0.1 visual revision
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('native-0.1/main.go')
          s = p.read_text()

          s = s.replace('appVersion     = "2.0.1"', 'appVersion     = "2.0.2"', 1)
          s = s.replace('Cliente nativo ETS2  |  sem PowerShell  |  GAT-LOG', 'Cliente nativo ETS2  |  GAT-LOG', 1)

          old = '''\t\tif child == hServerStatus {\n\t\t\tcol = rgb(73, 232, 132)\n\t\t}\n'''
          new = '''\t\tif child == hServerStatus {\n\t\t\tstatusText := strings.ToUpper(getText(hServerStatus))\n\t\t\tswitch {\n\t\t\tcase strings.Contains(statusText, "INACESSIVEL"), strings.Contains(statusText, "OFFLINE"):\n\t\t\t\tcol = rgb(255, 82, 82)\n\t\t\tcase strings.Contains(statusText, "ONLINE"):\n\t\t\t\tcol = rgb(73, 232, 132)\n\t\t\tdefault:\n\t\t\t\tcol = rgb(255, 194, 59)\n\t\t\t}\n\t\t}\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Bloco de cor do status nao encontrado')

          if 'appVersion     = "2.0.2"' not in s:
              raise SystemExit('Versao interna 2.0.2 nao aplicada')
          if 'Cliente nativo ETS2  |  sem PowerShell  |  GAT-LOG' in s:
              raise SystemExit('Texto antigo do topo ainda presente')

          p.write_text(s)
          PY

      - name: Build Windows EXE
        shell: bash
        run: |
          cd native-0.1
          GO111MODULE=off GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o ../GAT_TELEMETRIA_0.1.exe main.go assets.go

      - name: Publish binary and manifest
        shell: bash
        run: |
          mkdir -p releases
          mv GAT_TELEMETRIA_0.1.exe releases/GAT_TELEMETRIA_0.1.exe
          SHA=$(sha256sum releases/GAT_TELEMETRIA_0.1.exe | awk '{print $1}')
          cat > cliente2_version.json <<EOF
          {
            "app": "GAT Telemetria",
            "channel": "stable-native",
            "version": "2.0.2",
            "display_version": "0.1",
            "notas": "GAT Telemetria 0.1: topo simplificado e status inacessivel/offline destacado em vermelho.",
            "download_url": "https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_0.1.exe",
            "sha256": "$SHA"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/GAT_TELEMETRIA_0.1.exe cliente2_version.json native-0.1/main.go
          git commit -m "Atualiza GAT Telemetria 0.1 - ajuste visual" || exit 0
          git push
