name: RoadBETS2 consolidated test
on:
  workflow_dispatch:
  pull_request:
    paths: ['RoadBETS2-Telemetria/**', '.github/workflows/build-roadlife-consolidated.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RoadBETS2-Telemetria
            .github/workflows
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project RoadBETS2-Telemetria/tests/RoadLimitTests.csproj -c Release
      - run: dotnet build RoadBETS2-Telemetria/src/GAT_TELEMETRIA.csproj -c Release -p:UseSharedCompilation=false
      - shell: pwsh
        run: |
          $out = 'RoadBETS2-Telemetria/payload'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item RoadBETS2-Telemetria/src/bin/Release/net48/GAT_TELEMETRIA.exe "$out/GAT_TELEMETRIA_APP.exe"
          Copy-Item RoadBETS2-Telemetria/src/bin/Release/net48/GAT_TELEMETRIA.exe.config "$out/GAT_TELEMETRIA_APP.exe.config"
          New-Item -ItemType Directory -Force "$out/RoadLifeDash/Assets" | Out-Null
          Copy-Item RoadBETS2-Telemetria/Dashboard/RoadLifeDash.xaml "$out/RoadLifeDash/RoadLifeDash.xaml"
          Copy-Item RoadBETS2-Telemetria/Dashboard/Assets/roadbets2-logo.png "$out/RoadLifeDash/Assets/roadbets2-logo.png"
          New-Item -ItemType Directory -Force RoadBETS2-Telemetria/Installer/payload | Out-Null
          Copy-Item "$out/*" RoadBETS2-Telemetria/Installer/payload -Recurse
          $stage = 'roadbets2-test'
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item $out $stage -Recurse
          Copy-Item RoadBETS2-Telemetria/Install-Brand-Test.ps1 "$stage/Aplicar-teste.ps1"
          Copy-Item RoadBETS2-Telemetria/TESTE-1.0.68.21.md "$stage/LEIA-ME.md"
          '@echo off' + "`r`n" + 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Aplicar-teste.ps1"' | Set-Content "$stage/Aplicar-teste.cmd"
          '@echo off' + "`r`n" + 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Aplicar-teste.ps1" -Mode Restore' | Set-Content "$stage/Restaurar-anterior.cmd"
          $payloadPath = (Resolve-Path "$stage/payload").Path
          @(Get-ChildItem $payloadPath -Recurse -File | ForEach-Object { [pscustomobject]@{Path=$_.FullName.Substring($payloadPath.Length + 1);Hash=(Get-FileHash $_.FullName).Hash} }) | ConvertTo-Json | Set-Content "$stage/sha256.json"
          Compress-Archive "$stage/*" ROADBETS2_TELEMETRIA_1.0.68.21_TESTE.zip
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash $setup).Hash.ToLowerInvariant() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'SHA256 do compilador Inno incorreto' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $arguments = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/NOICONS',('/DIR="' + $compilerDir + '"'))
          $process = Start-Process $setup -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Falha ao instalar compilador Inno' }
          "INNO_ISCC=$compilerDir/ISCC.exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build updater installer
        shell: pwsh
        run: |
          & $env:INNO_ISCC /Q RoadBETS2-Telemetria/Installer/RoadLife-Update.iss
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar instalador de atualizacao' }
          Get-FileHash RoadBETS2-Telemetria/Installer/Output/ROADBETS2_TELEMETRIA_UPDATE_1.0.68.21.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ROADBETS2_TELEMETRIA_1.0.68.21_TESTE
          path: |
            ROADBETS2_TELEMETRIA_1.0.68.21_TESTE.zip
            RoadBETS2-Telemetria/Installer/Output/ROADBETS2_TELEMETRIA_UPDATE_1.0.68.21.exe

