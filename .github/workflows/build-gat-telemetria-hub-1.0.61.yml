name: Build GAT Telemetria Hub 1.0.61

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gat-telemetria-allinone-1.0.29/apply-video-borderless-1.0.61.ps1'
      - '.github/workflows/build-gat-telemetria-hub-1.0.61.yml'

permissions:
  contents: read

concurrency:
  group: gat-telemetria-hub-161-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Reconstruct and compile GAT Telemetria 1.0.61
        run: |
          $firstText = Get-Content 'gat-telemetria-dotnet-1.0.28/source.part.00' -Raw
          $first = [Convert]::FromBase64String($firstText.Trim())
          $parts = Get-ChildItem 'gat-telemetria-dotnet-1.0.28/source.bin.*' | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Esperava 5 partes binarias e encontrei $($parts.Count)" }
          $zip = Join-Path $PWD 'gat161-source.zip'
          $out = [IO.File]::Create($zip)
          try { $out.Write($first,0,$first.Length); foreach($part in $parts){$bytes=[IO.File]::ReadAllBytes($part.FullName);$out.Write($bytes,0,$bytes.Length)} } finally { $out.Dispose() }
          if(Test-Path 'gat161-build'){Remove-Item 'gat161-build' -Recurse -Force}
          Expand-Archive $zip 'gat161-build' -Force
          Get-ChildItem 'gat161-build' -Recurse -Include *.cs,*.csproj,*.config | ForEach-Object { $txt=Get-Content $_.FullName -Raw; if($txt -like '*1.0.28*'){Set-Content $_.FullName ($txt.Replace('1.0.28','1.0.32')) -Encoding UTF8} }

          $r="$PWD/gat161-build"
          $patches=@(
            'apply-offline-queue.ps1','apply-trip-sensor-v2.ps1','apply-stability-1.0.32.ps1','apply-beta-brand-1.0.32.ps1',
            'apply-radio-1.0.33.ps1','apply-radio-1.0.34.ps1','apply-radio-overlay-1.0.35.ps1','apply-radio-personal-1.0.36.ps1',
            'apply-radio-stream-1.0.37.ps1','apply-youtube-referrer-1.0.39.ps1','apply-dash-media-1.0.40.ps1','apply-hub-1.0.41.ps1',
            'apply-hub-fixes-1.0.42.ps1','apply-startup-fix-1.0.43.ps1','apply-modern-ui-1.0.44.ps1','apply-hub-1.0.45.ps1',
            'apply-mute-alert-1.0.46.ps1','apply-overlay-fix-1.0.47.ps1','apply-radio-background-1.0.48.ps1','apply-radio-home-1.0.49.ps1',
            'apply-radio-home-1.0.49-fix.ps1','apply-dash-overlay-1.0.50.ps1','apply-responsive-ui-1.0.51.ps1','apply-responsive-ui-1.0.52.ps1',
            'apply-ui-overlay-1.0.53.ps1','apply-overlay-independent-1.0.54.ps1','apply-window-layout-1.0.55-pre.ps1','apply-window-layout-1.0.55.ps1',
            'apply-window-layout-1.0.55-fix.ps1','apply-full-responsive-1.0.56.ps1','apply-version-only-1.0.57.ps1','apply-version-only-1.0.58.ps1',
            'apply-version-only-1.0.59.ps1','apply-full-dash-overlay-1.0.60.ps1','apply-video-borderless-1.0.61.ps1'
          )
          foreach($p in $patches){ & (Join-Path "$PWD/gat-telemetria-allinone-1.0.29" $p) -Root $r }

          $main=Get-ChildItem $r -Filter 'MainForm.cs' -Recurse | Select-Object -First 1
          $hub=Get-ChildItem $r -Filter 'MainForm.Hub041.cs' -Recurse | Select-Object -First 1
          $dashOverlay=Get-ChildItem $r -Filter 'DashOverlay060.cs' -Recurse | Select-Object -First 1
          $video=Get-ChildItem $r -Filter 'VideoOverlay041.cs' -Recurse | Select-Object -First 1
          $project=Get-ChildItem $r -Filter 'GAT_TELEMETRIA.csproj' -Recurse | Select-Object -First 1
          if(-not $main -or -not $hub -or -not $dashOverlay -or -not $video -or -not $project){throw 'Fonte 1.0.61 incompleto'}
          $mt=Get-Content $main.FullName -Raw
          $ht=Get-Content $hub.FullName -Raw
          $dt=Get-Content $dashOverlay.FullName -Raw
          $vt=Get-Content $video.FullName -Raw
          if($mt -notlike '*CurrentVersion = "1.0.61.0"*'){throw 'Versao 1.0.61 incorreta'}
          foreach($m in @('ABRIR DASH COMPLETO','OpenDashOverlay060','DashTargetReady060')){if($ht -notlike "*$m*"){throw "Hub 1.0.61 sem $m"}}
          foreach($m in @('DesignWidth = 1600','DesignHeight = 700','_web.ZoomFactor = scale')){if($dt -notlike "*$m*"){throw "DASH completo 1.0.61 sem $m"}}
          foreach($m in @('GAT_VIDEO_BORDERLESS_061','FormBorderStyle = FormBorderStyle.None','windowMinimize','windowClose','windowDrag','WM_NCHITTEST_061','Padding = new Padding(5)')){if($vt -notlike "*$m*"){throw "Video overlay 1.0.61 sem $m"}}
          if($vt -like '*Canal Web*'){throw 'Canal Web presente no video overlay 1.0.61'}

          msbuild $project.FullName /restore /t:Rebuild /p:Configuration=Release
          if($LASTEXITCODE -ne 0){throw 'Falha na compilacao 1.0.61'}
          $projectDir=Split-Path $project.FullName -Parent
          $exe=Get-ChildItem "$projectDir/bin/Release" -Filter 'GAT_TELEMETRIA.exe' -Recurse | Select-Object -First 1
          if(-not $exe){throw 'Executavel 1.0.61 nao gerado'}
          "GAT161_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $cfg=Join-Path $exe.Directory.FullName 'GAT_TELEMETRIA.exe.config'; if(Test-Path $cfg){"GAT161_CFG=$cfg" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append}

      - name: Validate proportional DASH overlay math
        run: |
          $tests=@(@{w=800;h=450},@{w=1220;h=490},@{w=1280;h=560},@{w=1366;h=650},@{w=1600;h=700},@{w=1920;h=1080})
          foreach($t in $tests){
            $scale=[Math]::Min($t.w/1600.0,$t.h/700.0); $scale=[Math]::Max(0.25,[Math]::Min(2.0,$scale))
            $ww=[Math]::Round(1600*$scale); $hh=[Math]::Round(700*$scale)
            if($ww -gt $t.w + 1 -or $hh -gt $t.h + 1){throw "DASH excedeu $($t.w)x$($t.h)"}
            if([Math]::Abs(($ww/$hh)-(1600.0/700.0)) -gt 0.01){throw "Proporcao alterada em $($t.w)x$($t.h)"}
          }

      - name: Prepare 1.0.61 stage
        run: |
          $base=Join-Path $PWD 'GAT_TELEMETRIA_SETUP_1.0.50_BASE.exe'
          Invoke-WebRequest 'https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_SETUP_1.0.50.exe' -OutFile $base
          if(-not(Test-Path $base) -or (Get-Item $base).Length -lt 1000000){throw 'Base 1.0.50 nao baixada'}
          $installed=Join-Path $PWD 'installed150'; $stage=Join-Path $PWD 'gat-telemetria-allinone-1.0.29/staging-hub161'
          foreach($p in @($installed,$stage)){if(Test-Path $p){Remove-Item $p -Recurse -Force}}
          New-Item -ItemType Directory -Force -Path $installed,$stage,(Join-Path $stage 'gat'),(Join-Path $stage 'trucksim') | Out-Null
          $args=@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR='+'"'+$installed+'"')); $proc=Start-Process -FilePath $base -ArgumentList $args -Wait -PassThru; if($proc.ExitCode -ne 0){throw "Base retornou $($proc.ExitCode)"}
          Copy-Item (Join-Path $installed 'GAT_TELEMETRIA.exe') (Join-Path $stage 'GAT_TELEMETRIA.exe') -Force
          Copy-Item $env:GAT161_EXE (Join-Path $stage 'GAT_TELEMETRIA_APP.exe') -Force
          if($env:GAT161_CFG -and (Test-Path $env:GAT161_CFG)){Copy-Item $env:GAT161_CFG (Join-Path $stage 'GAT_TELEMETRIA_APP.exe.config') -Force}
          $truckInstalled=Join-Path $installed 'TruckSimGPS'; if(Test-Path $truckInstalled){Copy-Item "$truckInstalled/*" (Join-Path $stage 'trucksim') -Recurse -Force}
          $skip=@('GAT_TELEMETRIA.exe','GAT_TELEMETRIA_APP.exe','GAT_TELEMETRIA_APP.exe.config','TruckSimGPS'); Get-ChildItem $installed -Force | Where-Object{$_.Name -notin $skip -and $_.Name -notlike 'unins*'} | ForEach-Object{Copy-Item $_.FullName (Join-Path $stage 'gat') -Recurse -Force}
          $dash=Join-Path $stage 'gat/gatdash-www'; if(-not(Test-Path (Join-Path $dash 'app.css'))){throw 'GAT DASH nao preservado'}
          $dashPatches=@('apply-gatdash-responsive-1.0.52.ps1','apply-gatdash-1.0.53.ps1','apply-gatdash-responsive-1.0.54.ps1','apply-gatdash-desktop-1.0.56.ps1','apply-gatdash-structure-1.0.57.ps1','apply-gatdash-structure-fix-1.0.58.ps1','apply-gatdash-proportional-1.0.59.ps1')
          foreach($p in $dashPatches){ & (Join-Path "$PWD/gat-telemetria-allinone-1.0.29" $p) -Root $dash }
          if(-not(Test-Path (Join-Path $stage 'trucksim/TruckSimGPS_Server.exe'))){throw 'TruckSimGPS nao preservado'}

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer 1.0.61
        run: |
          $issSource='gat-telemetria-allinone-1.0.29/GAT_Telemetria_AllInOne.iss'; $iss='gat-telemetria-allinone-1.0.29/GAT_Telemetria_Hub_1.0.61.iss'
          $text=Get-Content $issSource -Raw; $text=$text.Replace('1.0.29','1.0.61').Replace('staging','staging-hub161'); $text=$text.Replace('AppName=GAT Telemetria','AppName=GAT Telemetria BETA').Replace('DefaultGroupName=GAT Telemetria','DefaultGroupName=GAT Telemetria BETA'); $text=$text.Replace('Name: "{group}\GAT Telemetria";','Name: "{group}\GAT Telemetria BETA";').Replace('Name: "{group}\Desinstalar GAT Telemetria";','Name: "{group}\Desinstalar GAT Telemetria BETA";').Replace('Name: "{autodesktop}\GAT Telemetria";','Name: "{autodesktop}\GAT Telemetria BETA";').Replace('Description: "Abrir GAT Telemetria";','Description: "Abrir GAT Telemetria BETA";'); Set-Content $iss $text -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' $iss; if($LASTEXITCODE -ne 0){throw 'Falha ao gerar instalador 1.0.61'}
          $setup='gat-telemetria-allinone-1.0.29/Output/GAT_TELEMETRIA_SETUP_1.0.61.exe'; if(-not(Test-Path $setup)){throw 'Setup 1.0.61 nao gerado'}; New-Item -ItemType Directory -Force -Path releases | Out-Null; Copy-Item $setup 'releases/GAT_TELEMETRIA_SETUP_1.0.61.exe' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: GAT-Telemetria-Hub-1.0.61
          path: releases/GAT_TELEMETRIA_SETUP_1.0.61.exe
          if-no-files-found: error
