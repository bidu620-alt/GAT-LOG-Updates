name: BiduTruck FULL 1.0.68.35 test package (never publish)
on:
  pull_request:
    paths:
      - 'RoadBETS2-Telemetria/**'
      - 'trucksim-gps-gat/**'
      - '.github/workflows/build-bidutruck-full35-test.yml'
permissions:
  contents: read
jobs:
  build-full:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RoadBETS2-Telemetria
            trucksim-gps-gat
            .github/workflows
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Test and compile BiduTruck 1.0.68.35
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project 'RoadBETS2-Telemetria/tests/RoadLimitTests.csproj' -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          dotnet build 'RoadBETS2-Telemetria/src/GAT_TELEMETRIA.csproj' -c Release -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $v = (Get-Item 'RoadBETS2-Telemetria/src/bin/Release/net48/GAT_TELEMETRIA.exe').VersionInfo.FileVersion
          if ($v -ne '1.0.68.35') { throw "Incorrect version: $v" }
      - name: Recover complete VERIFIED 1.0.68.34 installation as stable base
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:RUNNER_TEMP 'bidutruck-1.0.68.34.exe'
          Invoke-WebRequest 'https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/BIDUTRUCK_TELEMETRIA_COMPLETO_1.0.68.34.exe' -OutFile $base
          if ((Get-FileHash $base).Hash.ToLowerInvariant() -ne 'e01ef3d9bb17d8efa12155d7ffe7164605cbfefd8bbe388cac6be19b22b55136') {
            throw 'The original 1.0.68.34 installer checksum does not match'
          }
          $payload = (New-Item -ItemType Directory -Force 'RoadBETS2-Telemetria/Installer/payload').FullName
          $args = @('/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/ISOLATEDTEST=1',('/DIR="'+$payload+'"'))
          $p = Start-Process $base -ArgumentList $args -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Base extraction failed: $($p.ExitCode)" }
          Get-ChildItem $payload -File -Filter 'unins*' | Remove-Item -Force
          if (-not (Test-Path "$payload/GAT_TELEMETRIA.exe")) { throw 'Original launcher missing' }
          if (-not (Test-Path "$payload/GAT_TELEMETRIA_APP.exe")) { throw 'Original application missing' }
          if (-not (Test-Path "$payload/TruckSimGPS/TruckSimGPS_Server.exe")) { throw 'Original GPS server missing' }
          if (-not (Test-Path "$payload/RoadLifeDash")) { throw 'Original dashboard missing' }
          $all = @(Get-ChildItem $payload -File -Recurse)
          if ($all.Count -lt 20 -or ($all | Measure-Object Length -Sum).Sum -lt 8000000) {
            throw "Original content unexpectedly small: $($all.Count) files"
          }
          Write-Host "VERIFIED BASE: $($all.Count) files, $(($all|Measure-Object Length -Sum).Sum) bytes"
          Copy-Item 'RoadBETS2-Telemetria/src/bin/Release/net48/GAT_TELEMETRIA.exe' "$payload/GAT_TELEMETRIA_APP.exe" -Force
          Copy-Item 'RoadBETS2-Telemetria/src/bin/Release/net48/GAT_TELEMETRIA.exe.config' "$payload/GAT_TELEMETRIA_APP.exe.config" -Force
      - name: Build customized TruckSim GPS 1.4.4 from official pinned tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'trucksim-gps-gat/build/trucksim-gps-server'
          git clone --depth 1 --branch 1.4.4 https://github.com/TruckSim-GPS/trucksim-gps-server.git $src
          if ($LASTEXITCODE -ne 0) { throw 'TruckSim official source clone failed' }
          & './trucksim-gps-gat/apply-patch.ps1' -Root "$PWD/$src"
          if ($LASTEXITCODE -ne 0) { throw 'Custom damage patch failed' }
          nuget restore "$src/source/Funbit.Ets.Telemetry.sln" -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'TruckSim restore failed' }
          msbuild "$src/source/Funbit.Ets.Telemetry.sln" /m /t:Rebuild /p:Configuration=Release /p:Platform="Mixed Platforms"
          if ($LASTEXITCODE -ne 0) { throw 'TruckSim build failed' }
          $server = "$src/source/Funbit.Ets.Telemetry.Server/bin/Release"
          $target = 'RoadBETS2-Telemetria/Installer/payload/TruckSimGPS_144_GAT_TEST'
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item "$server/*" $target -Recurse -Force
          if (-not (Test-Path "$target/TruckSimGPS_Server.exe")) { throw 'Custom GPS executable missing' }
      - name: Generate managed file manifest from COMPLETE payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = (Resolve-Path 'RoadBETS2-Telemetria/Installer/payload').Path
          $list = @(Get-ChildItem $payload -File -Recurse | ForEach-Object { $_.FullName.Substring($payload.Length + 1) })
          if ($list.Count -lt 25) { throw 'Insufficient files for full package' }
          [IO.File]::WriteAllLines((Join-Path $PWD 'RoadBETS2-Telemetria/Installer/managed-files.txt'),
            $list, [Text.UTF8Encoding]::new($false))
          Write-Host "FULL PACKAGE: $($list.Count) files"
      - name: Install pinned Inno compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash $setup).Hash.ToLowerInvariant() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Inno checksum mismatch'
          }
          $target = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/NOICONS',('/DIR="'+$target+'"'))
          $p = Start-Process $setup -ArgumentList $args -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'Inno installation failed' }
          "INNO_ISCC=$target/ISCC.exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and test FULL 1.0.68.35 setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:INNO_ISCC /Q 'RoadBETS2-Telemetria/Installer/Full35-Test.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Full installer compilation failed' }
          $exe = (Resolve-Path 'RoadBETS2-Telemetria/Installer/Output/BIDUTRUCK_TELEMETRIA_COMPLETO_1.0.68.35_TESTE.exe').Path
          if ((Get-Item $exe).Length -lt 10000000) { throw 'Full installer unexpectedly small' }
          $payload = (Resolve-Path 'RoadBETS2-Telemetria/Installer/payload').Path
          foreach ($mode in @('fresh','existing')) {
            $fixture = Join-Path $env:RUNNER_TEMP "full35-$mode"
            New-Item -ItemType Directory -Force $fixture | Out-Null
            'preserve-test-file' | Set-Content "$fixture/user-owned-file.txt"
            if ($mode -eq 'existing') { 'old-client' | Set-Content "$fixture/GAT_TELEMETRIA_APP.exe" }
            $args = @('/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/ISOLATEDTEST=1',('/DIR="'+$fixture+'"'))
            $p = Start-Process $exe -ArgumentList $args -WindowStyle Hidden -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Full install failed: $mode, code $($p.ExitCode)" }
            foreach ($file in Get-ChildItem $payload -File -Recurse) {
              $rel = $file.FullName.Substring($payload.Length + 1)
              $destination = Join-Path $fixture $rel
              if (-not (Test-Path -LiteralPath $destination)) { throw "Missing installed file $rel" }
              if ((Get-FileHash $destination).Hash -ne (Get-FileHash $file.FullName).Hash) {
                throw "Corrupted installed file $rel"
              }
            }
            if ((Get-Content "$fixture/user-owned-file.txt" -Raw).Trim() -ne 'preserve-test-file') {
              throw 'Installer removed unrelated user data'
            }
            if ($mode -eq 'existing') {
              $backup = @(Get-ChildItem $fixture -Directory -Filter 'backup-completa-1.0.68.35-*')
              if ($backup.Count -ne 1) { throw 'Backup missing or duplicated' }
              if ((Get-Content "$($backup[0].FullName)/GAT_TELEMETRIA_APP.exe" -Raw).Trim() -ne 'old-client') {
                throw 'App backup mismatch'
              }
            }
          }
          Get-FileHash $exe
          Write-Host "TEST FULL SIZE: $((Get-Item $exe).Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: BIDUTRUCK_TELEMETRIA_COMPLETO_1.0.68.35_TESTE
          path: RoadBETS2-Telemetria/Installer/Output/BIDUTRUCK_TELEMETRIA_COMPLETO_1.0.68.35_TESTE.exe
          retention-days: 14
