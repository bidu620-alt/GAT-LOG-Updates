name: Publish GAT Telemetria DotNet 1.0.0 Test

on:
  push:
    branches: [client-dotnet-winforms]
    paths:
      - 'client-dotnet/publish-1.0.0-test.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-dotnet-winforms
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate telemetry speed unit
        shell: pwsh
        run: |
          $src = Get-Content 'client-dotnet/GatTelemetry/TelemetryEngine.cs' -Raw
          if ($src -match 'speed\s*\*\s*3\.6' -or $src -match 'truck\.speed[^\r\n]*3\.6') {
            throw 'Conversão indevida por 3.6 encontrada no novo cliente.'
          }
          if ($src -notmatch '"truck\.speed"') { throw 'Campo truck.speed não encontrado.' }
          Write-Host 'OK: truck.speed será tratado diretamente em km/h.'

      - name: Build CSharp telemetry client
        shell: pwsh
        run: |
          dotnet restore client-dotnet/GatTelemetry/GatTelemetry.csproj
          dotnet build client-dotnet/GatTelemetry/GatTelemetry.csproj -c Release --no-restore

      - name: Prepare installer payload
        shell: pwsh
        run: |
          $out = 'client-dotnet/GatTelemetry/bin/Release/net48'
          $pay = 'client-dotnet/GatTelemetryInstaller/payload'
          New-Item -ItemType Directory -Force $pay | Out-Null
          Copy-Item "$out/GAT_TELEMETRIA.exe" "$pay/GAT_TELEMETRIA.exe" -Force
          Copy-Item "$out/GAT_TELEMETRIA.exe.config" "$pay/GAT_TELEMETRIA.exe.config" -Force
          Copy-Item "$out/Newtonsoft.Json.dll" "$pay/Newtonsoft.Json.dll" -Force
          if (-not (Test-Path "$pay/GAT_TELEMETRIA.exe")) { throw 'Cliente ausente no payload.' }

      - name: Build installer
        shell: pwsh
        run: |
          dotnet restore client-dotnet/GatTelemetryInstaller/GatTelemetryInstaller.csproj
          dotnet build client-dotnet/GatTelemetryInstaller/GatTelemetryInstaller.csproj -c Release --no-restore
          $setup = 'client-dotnet/GatTelemetryInstaller/bin/Release/net48/GAT_TELEMETRIA_DOTNET_SETUP_1.0.0_TESTE.exe'
          if (-not (Test-Path $setup)) { throw 'Instalador do cliente não foi gerado.' }
          Copy-Item $setup "$env:RUNNER_TEMP/GAT_TELEMETRIA_DOTNET_SETUP_1.0.0_TESTE.exe" -Force

      - name: Publish setup and updater manifest to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard HEAD
          git clean -fdx
          git checkout -B main origin/main
          mkdir -p releases
          cp "$RUNNER_TEMP/GAT_TELEMETRIA_DOTNET_SETUP_1.0.0_TESTE.exe" releases/GAT_TELEMETRIA_DOTNET_SETUP_1.0.0_TESTE.exe
          SHA=$(sha256sum releases/GAT_TELEMETRIA_DOTNET_SETUP_1.0.0_TESTE.exe | awk '{print $1}')
          cat > client_dotnet_version.json <<EOF2
          {
            "app": "GAT Telemetria CSharp",
            "channel": "test-dotnet",
            "version": "1.0.0",
            "display_version": "1.0.0 TESTE",
            "notas": "Novo motor C# WinForms. Mantem servidores, motorista e token antigos, conecta mesmo com o jogo fechado, aguarda a sessao automaticamente e corrige truck.speed sem multiplicar por 3.6.",
            "setup_url": "https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_DOTNET_SETUP_1.0.0_TESTE.exe",
            "sha256": "$SHA"
          }
          EOF2
          git add releases/GAT_TELEMETRIA_DOTNET_SETUP_1.0.0_TESTE.exe client_dotnet_version.json
          git commit -m "Publica GAT Telemetria CSharp 1.0.0 TESTE"
          git push origin main
          sha256sum releases/GAT_TELEMETRIA_DOTNET_SETUP_1.0.0_TESTE.exe
