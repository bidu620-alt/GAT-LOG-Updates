name: Protect D1 free tier
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gat-log-api-production
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check usage and refresh free-tier protection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python cloudflare-central/scripts/inspect-d1-usage.py --enforce
