name: Temp inspect EduardoVidal live
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-eduardovidal-live.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect EduardoVidal public state
        shell: python
        run: |
          import json, urllib.request, urllib.error
          base='https://api.gatlogets2.com.br'
          user='eduardovidal'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'GAT-Live-Diagnostic/1.0','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  try: body=json.loads(e.read().decode())
                  except: body={'error':'http_'+str(e.code)}
                  return e.code,body
              except Exception as e:
                  return 0,{'error':type(e).__name__+': '+str(e)}
          status,ver=get('/api/public/version')
          print('VERSION',status,json.dumps(ver,ensure_ascii=False))
          status,pdata=get('/api/public/driver?user='+user)
          p=(pdata or {}).get('profile') or {}
          m=p.get('current_mission') or {}
          print('PROFILE',status,json.dumps({
            'ok':(pdata or {}).get('ok'),'user':p.get('user'),'monthly_completed':p.get('monthly_completed'),
            'total_deliveries':p.get('total_deliveries'),'total_km':p.get('total_km'),'xp':p.get('xp'),'points':p.get('points'),'level':p.get('level'),
            'mission':{k:m.get(k) for k in ['id','sequence','title','state','catalog_id','cargo','source','destination','planned_distance_km','last_distance_km','trip_progress_confirmed','pending_classification','classification_suggested_work_id','rank_guard','last_rejected_reason','last_rejected_at']},
            'last_deliveries':[{k:d.get(k) for k in ['id','sequence','cargo','source','destination','distance_km','xp_awarded','xp','gat_points','ranking_eligible','ranking_reason','delivered_at','rank_verified','rank_client_version']} for d in (p.get('deliveries') or [])[-5:]]
          },ensure_ascii=False))
          status,live=get('/api/public/account-live')
          rows=[]
          for x in (live or {}).get('telemetry') or []:
              if str(x.get('account_user') or x.get('driver') or '').lower()!=user: continue
              raw=x.get('telemetry') or {}
              rows.append({
                'driver':x.get('driver'),'account_user':x.get('account_user'),'updated_at':x.get('updated_at'),'rank_status':x.get('rank_status'),
                'on_job':x.get('on_job'),'cargo_name':x.get('cargo_name'),'source_city':x.get('source_city'),'destination_city':x.get('destination_city'),
                'mass_kg':x.get('mass_kg'),'remaining_km':x.get('remaining_km'),'speed_kmh':x.get('speed_kmh'),
                'gat_client_version':raw.get('gat_client_version'),'gat_packet_id':raw.get('gat_packet_id'),'gat_collected_at':raw.get('gat_collected_at'),'gat_job_event':raw.get('gat_job_event'),
                'job_latched':raw.get('job_latched'),'job_latch_key':raw.get('job_latch_key'),
                'damage':{k:raw.get(k) for k in ['cargo_damage_pct','truck_engine_damage_pct','truck_transmission_damage_pct','truck_cabin_damage_pct','truck_chassis_damage_pct','truck_wheels_damage_pct','trailer_damage_pct']}
              })
          print('LIVE',status,json.dumps({'ok':(live or {}).get('ok'),'service_paused':(live or {}).get('service_paused'),'rows':rows},ensure_ascii=False))
          status,rdata=get('/api/public/ranking')
          rr=[x for x in (rdata or {}).get('ranking') or [] if str(x.get('user','')).lower()==user]
          print('RANKING',status,json.dumps({'ok':(rdata or {}).get('ok'),'rows':rr},ensure_ascii=False))
