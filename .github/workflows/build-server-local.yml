name: Build GAT Server 1.0.52 Local
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server-local/**', 'cloudflare-central/schema.sql', 'cloudflare-central/scripts/apply-d1-savings.py', 'cloudflare-central/ranking-telemetry.js', '.github/workflows/build-server-local.yml']
  pull_request:
    branches: [main]
    paths: ['server-local/**', 'cloudflare-central/schema.sql', 'cloudflare-central/scripts/apply-d1-savings.py', 'cloudflare-central/ranking-telemetry.js', '.github/workflows/build-server-local.yml']
permissions:
  contents: write
concurrency:
  group: gat-server-local-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 15
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Assemble local API and check migration, authentication, backups and deliveries
        timeout-minutes: 5
        shell: bash
        run: |
          python server-local/build-api.py
          python server-local/apply-admin-work-switch.py
          python server-local/apply-auto-classification.py server-local/runtime/worker.js
          python server-local/apply-auto-classification-safety.py server-local/runtime/worker.js
          python server-local/apply-trip-state-machine.py server-local/runtime/worker.js
          python server-local/apply-rank-startup-grace.py server-local/runtime/worker.js
          python server-local/apply-v147-lapeal-rank-fix.py server-local/runtime
          python server-local/apply-v148-jeanjc-rank-fix.py server-local/runtime
          node --test --test-timeout=30000 server-local/local.test.mjs server-local/delivery-event-regression.test.mjs server-local/auto-classification.test.mjs server-local/trip-state-machine.test.mjs server-local/lapeal-repair.test.mjs server-local/jeanjc-repair.test.mjs server-local/preflight-rank.test.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('server-local/runtime/tests/ranking.test.mjs')
          p.write_text(p.read_text().split("test('budget guard pauses")[0])
          import base64
          p=Path('server-local/ui/app.ico.base64')
          p.with_suffix('').write_bytes(base64.b64decode(p.read_text()))
          PY
          node --test server-local/runtime/tests/ranking.test.mjs
      - name: Remove temporary owner test mode and disable minimum distance
        run: python server-local/normalize-go-live.py
      - name: Apply legacy monthly trip migration
        run: python server-local/apply-monthly-trip-goal.py server-local/runtime/worker.js
      - name: Verify startup damage proof, JeanJC repair, Lapeal repair and legacy monthly migration
        shell: bash
        run: node --test --test-timeout=30000 server-local/go-live-ranking.test.mjs server-local/preflight-rank.test.mjs server-local/lapeal-repair.test.mjs server-local/jeanjc-repair.test.mjs server-local/monthly-trip-goal.test.mjs
      - name: Apply GAT Server 1.0.49 career history rules
        run: python server-local/apply-v149-career-history.py server-local/runtime
      - name: Verify GAT Server 1.0.49 history and ranking separation
        shell: bash
        run: node --test --test-timeout=30000 server-local/career-history-v149.test.mjs
      - name: Apply GAT Server 1.0.50 driver totals API
        run: python server-local/apply-v150-driver-directory-totals.py server-local/runtime
      - name: Verify GAT Server 1.0.50 driver directory totals
        shell: bash
        run: node --test --test-timeout=30000 server-local/driver-directory-v150.test.mjs
      - name: Apply GAT Server 1.0.51 resumable journeys and ranking recovery
        run: python server-local/apply-v151-resumable-journeys.py server-local/runtime
      - name: Verify GAT Server 1.0.51 resumable journeys
        shell: bash
        run: node --test --test-timeout=30000 server-local/resumable-journeys-v151.test.mjs
      - name: Apply GAT Server 1.0.52 Admin and Moderator points review
        run: python server-local/apply-v152-admin-gat-review.py server-local/runtime
      - name: Verify GAT Server 1.0.52 points review
        shell: bash
        run: node --test --test-timeout=30000 server-local/admin-gat-review-v152.test.mjs
      - name: Prepare panel version 1.0.52
        run: python server-local/patch-ui-version.py
      - name: Compile panel 1.0.52
        run: dotnet build server-local/ui/GAT_LOG_SERVER.csproj -c Release -o server-local/ui-out
      - name: Package verified Node runtime and application
        shell: python
        run: |
          import pathlib,subprocess,urllib.request,hashlib,zipfile,io,shutil,os,tempfile
          root=pathlib.Path('server-local');stage=root/'package';central=stage/'central';central.mkdir(parents=True)
          version=subprocess.check_output(['node','--version'],text=True).strip()
          name=f'node-{version}-win-x64.zip';base=f'https://nodejs.org/dist/{version}/'
          sums=urllib.request.urlopen(base+'SHASUMS256.txt').read().decode();expected=next(line.split()[0] for line in sums.splitlines() if line.split()[-1]==name)
          data=urllib.request.urlopen(base+name).read();assert hashlib.sha256(data).hexdigest()==expected,'Node download checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              (central/'node.exe').write_bytes(z.read(f'node-{version}-win-x64/node.exe'))
              for license_name in ['LICENSE','README.md']:(central/('NODE-'+license_name)).write_bytes(z.read(f'node-{version}-win-x64/{license_name}'))
          for name in ['worker.js','host.mjs','database.mjs','ranking-telemetry.js','read-cache.js','budget-guard.js','schema.sql','package.json']:shutil.copy2(root/'runtime'/name,central/name)
          (central/'migrations').mkdir();shutil.copy2(root/'runtime/migrations/0004_read_efficiency.sql',central/'migrations/0004_read_efficiency.sql')
          shutil.copy2(root/'LEIA-ME.txt',central/'LEIA-ME.txt');shutil.copy2(root/'ui-out/GAT_LOG_SERVER.exe',stage/'GAT_LOG_SERVER.exe')
          with tempfile.TemporaryDirectory() as localapp:
              check=subprocess.run([str((central/'node.exe').resolve()),str((central/'host.mjs').resolve())],env={**os.environ,'LOCALAPPDATA':localapp},capture_output=True,text=True,timeout=20)
              assert check.returncode==1 and 'Importe a exportacao' in check.stderr,check.stderr
          text=(central/'worker.js').read_text();rank=(central/'ranking-telemetry.js').read_text();cache=(central/'read-cache.js').read_text();host=(central/'host.mjs').read_text();schema=(central/'schema.sql').read_text();panel=(root/'ui/GatLogServer/CentralPanel.cs').read_text()
          assert '1.0.52-local' in text and 'const MIN_KM=0;' in text and 'cargo_classification_queue' in text and '/api/site/admin/classify' in text and 'first.score>=.85' in text and 'suvs?' in text and "observedIdle=clean(str(raw,'gat_job_state'" in text and 'tripReplaced=!!(hasLoadedJob' in text and "invalidateRead('profile:'+account)" in text and 'export function invalidateRead' in cache
          assert 'RANK_STARTUP_GRACE_MS = 120000' in rank and 'migrated_startup_guard_v145' in rank and 'startup_started_at:t' in text and "last_rejected_reason:undefined" in text
          assert 'preflightTruckDamageReady=false' in text and 'preflight_truck_damage_ready' in text and '!next.preflight_truck_damage_ready' in rank
          assert 'monthly_completed=monthly_completed+1' in text and 'history_recorded:true' in text and 'ranking_reason:rankReason' in text and "reason:'route_already_used'" not in text and "classification_status:'pending',monthly_increment:1" in text
          assert 'SELECT p.user,p.monthly_completed,p.total_deliveries' in text and 'scoring:{base_per_delivery:100}' in text and 'max_monthly:3000' not in text
          assert "const adminTest=false;" in text and "clean(user)==='biduzao'" not in text and "admin_test_mode:clean(s.user)==='biduzao'" not in text
          assert 'CREATE TABLE IF NOT EXISTS open_trips' in schema and 'CREATE TABLE IF NOT EXISTS open_trip_aliases' in schema and 'prepareOpenJourney' in text and 'finishOpenJourney' in text and 'canonical_trip_id' in text
          assert 'DAMAGE_TRANSIENT_GRACE_MS = 30000' in rank and 'RESUME_VALID_SAMPLES = 2' in rank and 'telemetry_resume_pending' in rank
          assert "observedIdle||tripReplaced||gatJobEvent==='cancelled'" not in text
          assert 'function gatReviewSuggestion' in text and "'review_gat_points'" in text and 'gat_review_suggested_points' in text and 'gat_manual_review' in text and 'gat_review_already_done' in text and 'automatic_ranking_reason' in text and 'points=MAX(0,points+?)' in text
          assert 'go_live_baseline_2026_09_02' in host and 'DELETE FROM deliveries' in host and 'points=0' in host and 'reconcileMonthlyTripCount' in host and 'substr(d.delivered_at,1,7)' in host and 'MIN(monthly_goal' not in host
          assert 'repairLapealMowerDelivery' in host and 'repair_lapeal_mower_2026_09_03_v1' in host and 'Mower Conditioner Krone BiG M 450' in host and 'distance=1135' in host and 'gatPoints=100' in host
          assert 'repairJeanJcRejectedDelivery' in host and 'recoverJeanJcEvidence' in host and 'repair_jeanjc_2026_09_03_v1' in host and '90be671a94074e8e900ef83e892b6a41' in host and 'repair_fallback_no_backup' in host
          assert 'repair_eduardovidal_loader_2026_09_03_v151' in host and 'transient_final_damage_packet' in host
          assert 'IsLocalCentral' in panel and 'version.EndsWith("-local"' in panel and '1.0.40-local' not in panel
          release=pathlib.Path('releases/GAT_SERVER_LOCAL_1.0.52.zip')
          with zipfile.ZipFile(release,'w',zipfile.ZIP_DEFLATED) as z:
              for p in stage.rglob('*'):
                  if p.is_file():z.write(p,p.relative_to(stage))
          digest=hashlib.sha256(release.read_bytes()).hexdigest();p=root/'updater/Program.cs';p.write_text(p.read_text().replace('__PAYLOAD_SHA256__',digest))
          release.with_suffix('.sha256').write_text(digest+'  '+release.name+'\n')
      - name: Compile updater
        run: dotnet build server-local/updater/Updater.csproj -c Release -o server-local/updater-out
      - name: Publish GAT Server 1.0.52 updater
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          cp server-local/updater-out/GAT_LOG_SERVER_UPDATE_1.0.52_LOCAL.exe releases/GAT_LOG_SERVER_UPDATE_1.0.52_LOCAL.exe
          git config user.name 'GAT Server Build'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/GAT_LOG_SERVER_UPDATE_1.0.52_LOCAL.exe releases/GAT_SERVER_LOCAL_1.0.52.zip releases/GAT_SERVER_LOCAL_1.0.52.sha256
          git commit -m 'Publish GAT Server 1.0.52 Admin and Moderator points review'
          git restore server-local/updater/Program.cs server-local/ui/GatLogServer/MainForm.cs
          git pull --rebase -X theirs
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: GAT-Server-1.0.52-local-updater
          path: server-local/updater-out/GAT_LOG_SERVER_UPDATE_1.0.52_LOCAL.exe
