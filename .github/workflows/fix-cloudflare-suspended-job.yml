name: Fix Cloudflare Suspended Job

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-central/apply-suspended-job-fix.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Freeze mission while job is suspended
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-central/worker.js')
          s=p.read_text(encoding='utf-8')
          old=""" const delivered=bool(raw,'gameplay.jobDelivered','jobDelivered');
 if(!delivered&&!f.on_job&&m.state==='active'){m=await resetAssigned(env,user,m,'job_cancelled');return{type:'mission_cancelled',mission:m}}
 if(!delivered)return f.on_job?{type:'mission_in_progress',mission:m,distance_km:planned}:null;
"""
          new=""" const delivered=bool(raw,'gameplay.jobDelivered','jobDelivered');
 const cancelled=bool(raw,'gameplay.jobCancelled','jobCancelled','gameplay.jobCanceled','jobCanceled','job.cancelled','job.canceled');
 if(!delivered&&cancelled&&(m.state==='active'||m.state==='suspended')){m=await resetAssigned(env,user,m,'job_cancelled');return{type:'mission_cancelled',mission:m}}
 if(!delivered&&!f.on_job&&m.state==='active'){
   m={...m,state:'suspended',suspended_at:t};
   await env.DB.prepare('UPDATE profiles SET current_mission_json=?,updated_at=? WHERE user=?').bind(JSON.stringify(m),t,user).run();
   return{type:'mission_suspended',mission:m};
 }
 if(!delivered&&!f.on_job&&m.state==='suspended')return{type:'mission_suspended',mission:m};
 if(!delivered)return f.on_job?{type:'mission_in_progress',mission:m,distance_km:planned}:null;
"""
          if old not in s:
              raise SystemExit('Bloco de cancelamento esperado nao encontrado')
          s=s.replace(old,new,1)
          s=s.replace("const VERSION='1.0.41-cloudflare';","const VERSION='1.0.42-cloudflare';",1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check cloudflare-central/worker.js
          grep -q "mission_suspended" cloudflare-central/worker.js
          grep -q "jobCancelled" cloudflare-central/worker.js
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-central/worker.js
          git commit -m "Suporta carga suspensa sem cancelar trabalho"
          git push origin main
