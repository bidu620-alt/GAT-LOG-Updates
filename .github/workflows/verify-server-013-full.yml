name: Verify GAT-LOG Server 0.1.3 full

on:
  push:
    branches:
      - release/server-0.1.3

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover source
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          set -e
          echo 'Recovered:'
          find /tmp/gat-src -maxdepth 4 -type f -printf '%P\n' | sort
          test -f /tmp/gat-src/go.mod
          test -f /tmp/gat-src/internal/core/core.go
          test -f /tmp/gat-src/cmd/agent/main.go
          test -f /tmp/gat-src/cmd/ui/main.go
          test -f /tmp/gat-src/cmd/ui/assets/banner.png
          test -f /tmp/gat-src/cmd/ui/assets/logo.png
      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          core=Path('/tmp/gat-src/internal/core/core.go')
          s=core.read_text(encoding='utf-8')
          s=s.replace('InternalVersion = "0.1.0"','InternalVersion = "0.1.3"')
          s=s.replace(r'(?im)^.*?\[MP\]\s+([^\r\n,]+?)\s+(connected|disconnected)(?:,|\s|$)', r'(?im)^.*?\[MP\]\s+([^\[\r\n,]+?)\s+(connected|disconnected)(?:,|\s|$)')
          core.write_text(s,encoding='utf-8')
          agent=Path('/tmp/gat-src/cmd/agent/main.go')
          t=agent.read_text(encoding='utf-8')
          t=t.replace('\tif persist {\n\t\ta.saveTelemetry()\n\t}\n\ta.detectEvents(prev, rec)\n\tjsonOut(w, 200, map[string]any{"ok": true, "driver": b.Driver, "received_at": rec.UpdatedAt})', '\tif persist {\n\t\tgo a.saveTelemetry()\n\t}\n\ta.detectEvents(prev, rec)\n\tjsonOut(w, 200, map[string]any{"ok": true, "driver": b.Driver, "received_at": rec.UpdatedAt})')
          agent.write_text(t,encoding='utf-8')
          ui=Path('/tmp/gat-src/cmd/ui/main.go')
          u=ui.read_text(encoding='utf-8')
          u=u.replace('GAT-LOG SERVER NATIVE 0.1 | Gerenciador de Servidor ETS2 + Telemetria','GAT-LOG SERVER NATIVE 0.1.3 | ETS2 + Telemetria')
          u=u.replace('GAT-LOG Server Native 0.1"','GAT-LOG Server Native 0.1.3"')
          u=u.replace('Native 0.1 | Agente separado','Native 0.1.3 | Agente separado')
          ui.write_text(u,encoding='utf-8')
          PY
          cd /tmp/gat-src
          gofmt -w internal/core/core.go cmd/agent/main.go cmd/ui/main.go
      - name: Build Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gat-src
          mkdir -p /tmp/dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/dist/GAT_LOG_AGENT.exe ./cmd/agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/dist/GAT_LOG_SERVER.exe ./cmd/ui
          sha256sum /tmp/dist/*.exe
          ls -lh /tmp/dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: gat-log-server-0.1.3-full
          path: /tmp/dist/*.exe
          retention-days: 7
