name: Build GAT DASH Android 1.2.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gat-dash/android/**'
      - '.github/workflows/build-gat-dash-v1.yml'

permissions:
  contents: write

concurrency:
  group: gat-dash-android-v120-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate Android 1.2.0 dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          test -f gat-dash/android/app/src/main/assets/index.html
          test -f gat-dash/android/app/src/main/assets/app.css
          test -f gat-dash/android/app/src/main/assets/app.js
          test -f gat-dash/android/app/src/main/assets/truck_trip.svg
          grep -q 'GAT DASH Android 1.2.0' gat-dash/android/app/src/main/assets/index.html
          if grep -Eiq 'id="[^"]*(radio|media)|class="[^"]*(radio|media)|media\.js|<audio|<video|CANAL GAT|MEU VÍDEO|CANAL WEB' gat-dash/android/app/src/main/assets/index.html gat-dash/android/app/src/main/assets/app.js; then
            echo 'Controle de radio/media ainda presente na interface Android' >&2
            exit 1
          fi
      - name: Build Android APK 1.2.0
        shell: bash
        run: |
          set -euo pipefail
          gradle -p gat-dash/android :app:assembleDebug --no-daemon
          cp gat-dash/android/app/build/outputs/apk/debug/app-debug.apk GAT_DASH_ANDROID_1.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gat-dash-android-1.2.0
          path: GAT_DASH_ANDROID_1.2.0.apk

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gat-dash-android-1.2.0
          path: dist/android
      - name: Publish Android 1.2.0 and preserve PC 1.1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cp dist/android/GAT_DASH_ANDROID_1.2.0.apk releases/GAT_DASH_ANDROID_1.2.0.apk
          export APK_SHA=$(sha256sum releases/GAT_DASH_ANDROID_1.2.0.apk | awk '{print $1}')
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('gat_dash_version.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['app'] = 'GAT DASH'
          data['version'] = '1.2.0'
          data['android_version'] = '1.2.0'
          data['pc_version'] = '1.1.1'
          data['display_version'] = 'GAT DASH Android 1.2.0 • PC 1.1.1'
          data['notes'] = 'Android 1.2.0 recebe o novo GAT DASH mobile focado em telemetria, rota, viagem e condição do caminhão, sem GAT Rádio. A versão PC permanece 1.1.1 sem alterações.'
          data['android_url'] = 'https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_DASH_ANDROID_1.2.0.apk'
          data['android_sha256'] = os.environ['APK_SHA']
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'GAT DASH Build'
          git config user.email 'actions@users.noreply.github.com'
          git add -f releases/GAT_DASH_ANDROID_1.2.0.apk gat_dash_version.json
          git commit -m 'Publish GAT DASH Android 1.2.0'
          git pull --rebase -X theirs origin main
          git push origin main
