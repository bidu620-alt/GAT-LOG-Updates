name: Publish GAT Telemetria DotNet 1.0.17 Odometer Anticheat

on:
  push:
    branches: [client-dotnet-winforms]
    paths:
      - 'client-dotnet/publish-1.0.17-odometer-anticheat.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-dotnet-winforms
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply client through 1.0.17
        shell: pwsh
        run: |
          python client-dotnet/build103/apply_103_fixed_servers.py
          python client-dotnet/build104/apply_104_steam_identity.py
          python client-dotnet/build105/apply_105_robust_driver_identity.py
          python client-dotnet/build106/apply_106_gat_account.py
          python client-dotnet/build106/fix_106_account_labels.py
          python client-dotnet/build107/apply_107_mission_progress.py
          python client-dotnet/build107/fix_107_versions.py
          python client-dotnet/build108/apply_108_live_map_truck.py
          python client-dotnet/build109/apply_109_independent_central.py
          python client-dotnet/build110/apply_110_map_mode.py
          python client-dotnet/build111/apply_111_eaa_map.py
          python client-dotnet/build112/apply_112_voice_work_started.py
          python client-dotnet/build113/apply_113_work_status.py
          python client-dotnet/build114/apply_114_trip_journal.py
          python client-dotnet/build115/apply_115_driving_rules.py
          python client-dotnet/build116/apply_116_stability_updates.py
          python client-dotnet/build117/apply_117_odometer_anticheat.py
          $main = Get-Content 'client-dotnet/GatTelemetry/MainForm.cs' -Raw
          $journal = Get-Content 'client-dotnet/GatTelemetry/TripJournal.cs' -Raw
          if ($main -notmatch 'CurrentVersion = "1\.0\.17"') { throw 'Versao 1.0.17 ausente.' }
          if ($journal -notmatch 'driven_distance_km') { throw 'Distancia real ausente.' }
          if ($journal -notmatch 'truck\.odometer') { throw 'Leitura de odometro ausente.' }
          if ($journal -notmatch 'VehicleChanged') { throw 'Protecao de troca de veiculo ausente.' }
          if ($journal -notmatch 'OdometerDiscontinuity') { throw 'Protecao de salto de odometro ausente.' }

      - name: Reuse blue GAT CLIENT icon
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'GAT_TELEMETRIA_1.0.16.exe'
          Invoke-WebRequest 'https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.16_ESTAVEL_TESTE.exe' -OutFile $src
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($src)
          if ($null -eq $icon) { throw 'Nao foi possivel extrair o icone azul.' }
          foreach ($p in @('client-dotnet/GatTelemetry/assets/GAT_CLIENT.ico','client-dotnet/GatTelemetryInstaller/assets/GAT_CLIENT.ico')) { New-Item -ItemType Directory -Force (Split-Path $p -Parent) | Out-Null; $fs=[System.IO.File]::Create($p); try {$icon.Save($fs)} finally {$fs.Dispose()} }
          $icon.Dispose()

      - name: Ensure application icons
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          proj=Path('client-dotnet/GatTelemetry/GatTelemetry.csproj'); s=proj.read_text(encoding='utf-8')
          if '<ApplicationIcon>' not in s: s=s.replace('<ApplicationManifest>app.manifest</ApplicationManifest>','<ApplicationManifest>app.manifest</ApplicationManifest>\n    <ApplicationIcon>assets\\GAT_CLIENT.ico</ApplicationIcon>',1)
          proj.write_text(s,encoding='utf-8')
          ip=Path('client-dotnet/GatTelemetryInstaller/GatTelemetryInstaller.csproj'); x=ip.read_text(encoding='utf-8')
          if '<ApplicationIcon>' not in x: x=x.replace('<ApplicationManifest>app.manifest</ApplicationManifest>','<ApplicationManifest>app.manifest</ApplicationManifest>\n    <ApplicationIcon>assets\\GAT_CLIENT.ico</ApplicationIcon>',1)
          ip.write_text(x,encoding='utf-8')
          '@ | Set-Content "$env:RUNNER_TEMP\icons117.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\icons117.py"

      - name: Build CSharp telemetry client and updater
        shell: pwsh
        run: |
          dotnet restore client-dotnet/GatTelemetry/GatTelemetry.csproj
          dotnet build client-dotnet/GatTelemetry/GatTelemetry.csproj -c Release --no-restore
          $out='client-dotnet/GatTelemetry/bin/Release/net48'; $pay='client-dotnet/GatTelemetryInstaller/payload'
          if (Test-Path $pay) { Remove-Item $pay -Recurse -Force }
          New-Item -ItemType Directory -Force $pay | Out-Null
          Copy-Item "$out/GAT_TELEMETRIA.exe" "$pay/GAT_TELEMETRIA.exe" -Force
          Copy-Item "$out/GAT_TELEMETRIA.exe.config" "$pay/GAT_TELEMETRIA.exe.config" -Force
          Copy-Item "$out/Newtonsoft.Json.dll" "$pay/Newtonsoft.Json.dll" -Force
          dotnet restore client-dotnet/GatTelemetryInstaller/GatTelemetryInstaller.csproj
          dotnet build client-dotnet/GatTelemetryInstaller/GatTelemetryInstaller.csproj -c Release --no-restore
          $update='client-dotnet/GatTelemetryInstaller/bin/Release/net48/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.17_ANTIBURLA_TESTE.exe'
          if (-not (Test-Path $update)) { throw 'Atualizador 1.0.17 nao gerado.' }
          Copy-Item $update "$env:RUNNER_TEMP/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.17_ANTIBURLA_TESTE.exe" -Force

      - name: Publish updater and manifest to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main; git reset --hard HEAD; git clean -fdx; git checkout -B main origin/main
          mkdir -p releases; cp "$RUNNER_TEMP/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.17_ANTIBURLA_TESTE.exe" releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.17_ANTIBURLA_TESTE.exe
          SHA=$(sha256sum releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.17_ANTIBURLA_TESTE.exe | awk '{print $1}')
          cat > client_dotnet_version.json <<EOF
          {
            "app": "GAT Telemetria CSharp",
            "channel": "test-dotnet",
            "version": "1.0.17",
            "display_version": "1.0.17 DISTANCIA REAL",
            "notas": "Registra o odometro no inicio e no fim de cada carga, calcula a distancia realmente dirigida e envia a identidade disponivel do caminhao. Detecta troca de veiculo sem cancelamento e saltos impossiveis de odometro. Cancelar a carga encerra apenas a tentativa; o Trabalho GAT continua selecionado para pegar outra carga compativel.",
            "setup_url": "https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.17_ANTIBURLA_TESTE.exe",
            "sha256": "$SHA"
          }
          EOF
          git add releases/GAT_TELEMETRIA_DOTNET_UPDATE_1.0.17_ANTIBURLA_TESTE.exe client_dotnet_version.json
          git commit -m "Publica GAT Telemetria 1.0.17 com distancia real"
          git push origin main
