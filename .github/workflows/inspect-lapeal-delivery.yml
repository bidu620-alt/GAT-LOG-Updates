name: Inspect EduardoVidal delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-lapeal-delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Capture EduardoVidal profile, catalog, live telemetry and ranking
        shell: python
        run: |
          import json, urllib.request, urllib.parse, pathlib, datetime
          base='https://api.gatlogets2.com.br'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'GAT-EduardoVidal-Diagnostic/1.0','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return {'status': r.status, 'data': json.load(r)}
              except Exception as e:
                  return {'status': getattr(e,'code',0), 'error': repr(e)}
          user='eduardovidal'
          profile=get('/api/public/driver?user='+urllib.parse.quote(user))
          catalog=get('/api/public/work/catalog?user='+urllib.parse.quote(user))
          live=get('/api/public/account-live')
          ranking=get('/api/public/ranking')
          version=get('/api/public/version')
          live_data=(live.get('data') or {}).get('telemetry') or []
          rank_data=(ranking.get('data') or {}).get('ranking') or []
          rows=[x for x in live_data if str(x.get('account_user') or x.get('driver') or '').lower()==user]
          rank=[x for x in rank_data if str(x.get('user') or '').lower()==user]
          out={
            'captured_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'version':version,
            'profile':profile,
            'catalog':catalog,
            'live':rows,
            'ranking':rank,
          }
          p=pathlib.Path('server-local/eduardovidal-delivery-diagnostic.json')
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
      - name: Save diagnostic snapshot
        shell: bash
        run: |
          git config user.name 'GAT Diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git add server-local/eduardovidal-delivery-diagnostic.json
          git commit -m 'Diagnostico: ultima entrega do EduardoVidal' || exit 0
          git pull --rebase -X theirs
          git push
