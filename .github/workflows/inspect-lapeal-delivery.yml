name: Inspect Lapeal delivery
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Confirm previous delivery receipt for Lapeal
        shell: python
        run: |
          import json, urllib.request, urllib.parse
          base='https://api.gatlogets2.com.br'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'GAT-Lapeal-Diagnostic/3.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r: return json.load(r)
          user='lapeal67'
          p=get('/api/public/driver?user='+urllib.parse.quote(user)).get('profile') or {}
          live=get('/api/public/account-live').get('telemetry') or []
          row=next((x for x in live if str(x.get('account_user') or x.get('driver') or '').lower()==user),{})
          raw=row.get('telemetry') or {}
          report={
            'profile':{k:p.get(k) for k in ['user','monthly_completed','monthly_goal','total_deliveries','total_km','xp','points','perfect_trips','penalty_xp','speed_fines']},
            'current_mission':p.get('current_mission'),
            'last_deliveries':(p.get('deliveries') or [])[-5:],
            'live_summary':{k:row.get(k) for k in ['updated_at','rank_status','cargo_name','cargo_id','source_city','destination_city','mass_kg','remaining_km']},
            'live_job':raw.get('job'),
            'live_gameplay':raw.get('gameplay'),
            'live_damage':{k:raw.get(k) for k in ['cargo_damage_pct','truck_engine_damage_pct','truck_transmission_damage_pct','truck_cabin_damage_pct','truck_chassis_damage_pct','truck_wheels_damage_pct','trailer_damage_pct','gat_job_state','gat_job_event','gat_trip_id']}
          }
          print('=== LAPEAL_RECEIPT ===')
          print(json.dumps(report,ensure_ascii=False,indent=2))
