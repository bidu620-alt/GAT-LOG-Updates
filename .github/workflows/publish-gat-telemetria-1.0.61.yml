name: Publish GAT Telemetria 1.0.61

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-gat-telemetria-1.0.61.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download approved 1.0.61 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf publish161
          mkdir -p publish161
          gh run download 35037218525 -n GAT-Telemetria-Hub-1.0.61 -D publish161
          test -f publish161/GAT_TELEMETRIA_SETUP_1.0.61.exe

      - name: Publish installer, updater metadata and site card
        run: |
          mkdir -p releases
          cp publish161/GAT_TELEMETRIA_SETUP_1.0.61.exe releases/GAT_TELEMETRIA_SETUP_1.0.61.exe
          SHA256=$(sha256sum releases/GAT_TELEMETRIA_SETUP_1.0.61.exe | awk '{print $1}')
          export SHA256
          python - <<'PY'
          import json, os, pathlib, re

          root = pathlib.Path('.')
          meta = {
              "app": "GAT Telemetria BETA",
              "channel": "test-dotnet",
              "version": "1.0.61.0",
              "display_version": "BETA 1.0.61 • DASH COMPLETO + VÍDEO SEM BORDA",
              "notas": "GAT DASH completo em janela independente com proporção preservada em qualquer resolução. A sobreposição de vídeo agora usa barra GAT própria, sem a faixa branca do Windows, mantendo mover, redimensionar, minimizar, fechar e a última posição salva.",
              "setup_url": "https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_SETUP_1.0.61.exe",
              "sha256": os.environ["SHA256"]
          }
          (root / 'client_dotnet_version.json').write_text(json.dumps(meta, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          p = root / 'docs' / 'index.html'
          html = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'<a class="download-mini" href="https://raw\.githubusercontent\.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_SETUP_[^"]+\.exe">'
              r'<strong>GAT Telemetria [^<]+</strong><span>.*?</span><b>BAIXAR GAT TELEMETRIA</b></a>',
              re.S
          )
          replacement = (
              '<a class="download-mini" href="https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/GAT_TELEMETRIA_SETUP_1.0.61.exe">'
              '<strong>GAT Telemetria 1.0.61 • PC</strong>'
              '<span>GAT DASH completo em janela independente e proporcional em qualquer resolução. Sobreposição de vídeo sem a barra branca do Windows, com barra GAT própria, minimizar, fechar, mover e redimensionar.</span>'
              '<b>BAIXAR GAT TELEMETRIA</b></a>'
          )
          html2, count = pattern.subn(replacement, html, count=1)
          if count != 1:
              raise SystemExit('Card do GAT Telemetria não foi localizado no site')
          p.write_text(html2, encoding='utf-8')

          log = root / 'docs' / 'ATUALIZACOES.md'
          text = log.read_text(encoding='utf-8') if log.exists() else ''
          entry = '''\n## 2026-09-15 — GAT Telemetria BETA 1.0.61\n- GAT DASH completo agora abre em uma janela independente com proporção preservada ao aumentar ou diminuir.\n- Melhor compatibilidade com monitores e resoluções diferentes, sem cortar ou deformar o DASH.\n- Sobreposição de vídeo sem a barra branca do Windows; a barra GAT própria permite mover, minimizar e fechar.\n- Redimensionamento pelas bordas e salvamento da última posição/tamanho continuam disponíveis.\n- Rádio/TV mantém somente Canal GAT e Meu Vídeo.\n'''
          if 'GAT Telemetria BETA 1.0.61' not in text:
              log.write_text(text + entry, encoding='utf-8')
          PY

      - name: Commit public 1.0.61 release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/GAT_TELEMETRIA_SETUP_1.0.61.exe client_dotnet_version.json docs/index.html docs/ATUALIZACOES.md
          if git diff --cached --quiet; then
            echo 'Nada novo para publicar.'
            exit 0
          fi
          git commit -m 'Publish GAT Telemetria 1.0.61'
          git push origin HEAD:main
