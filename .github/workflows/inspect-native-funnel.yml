name: Inspect native funnel

on:
  push:
    branches:
      - release/server-0.1.3

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover and inspect funnel
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          echo '=== DATA DIR ==='
          grep -nEi -C 35 'func DataDir|TelemetryPath|LOCALAPPDATA|GAT-LOG' /tmp/gat-src/internal/core/core.go | head -n 4000
          echo '=== FUNNEL ==='
          grep -nEi -C 50 'funnel|tailscale' /tmp/gat-src/cmd/agent/main.go /tmp/gat-src/internal/core/core.go | head -n 5000
          exit 0
