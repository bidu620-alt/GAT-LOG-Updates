name: Build TruckSim GPS GAT Danos

on:
  push:
    paths:
      - 'trucksim-gps-gat/trigger.txt'
      - '.github/workflows/build-trucksim-gps-gat.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout GAT
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Baixar fonte oficial TruckSim GPS
        shell: powershell
        run: |
          if (Test-Path trucksim-gps-gat/build) { Remove-Item trucksim-gps-gat/build -Recurse -Force }
          New-Item -ItemType Directory -Force -Path trucksim-gps-gat/build | Out-Null
          git clone --depth 1 https://github.com/TruckSim-GPS/trucksim-gps-server.git trucksim-gps-gat/build/trucksim-gps-server
          Remove-Item trucksim-gps-gat/build/trucksim-gps-server/.git -Recurse -Force

      - name: Aplicar danos reais GAT
        shell: powershell
        run: |
          ./trucksim-gps-gat/apply-patch.ps1 -Root "$PWD/trucksim-gps-gat/build/trucksim-gps-server"

      - name: Empacotar fonte GPL correspondente
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          $src = "$PWD/trucksim-gps-gat/build/trucksim-gps-server"
          $zip = "$PWD/releases/TruckSimGPS_GAT_DANOS_1.0_SOURCE.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src/*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Restaurar NuGet
        shell: powershell
        run: |
          nuget restore trucksim-gps-gat/build/trucksim-gps-server/source/Funbit.Ets.Telemetry.sln -NonInteractive

      - name: Compilar TruckSim GPS GAT
        shell: powershell
        run: |
          msbuild trucksim-gps-gat/build/trucksim-gps-server/source/Funbit.Ets.Telemetry.sln /m /t:Rebuild /p:Configuration=Release /p:Platform="Mixed Platforms"
          $exe = 'trucksim-gps-gat/build/trucksim-gps-server/source/Funbit.Ets.Telemetry.Server/bin/Release/TruckSimGPS_Server.exe'
          if (-not (Test-Path $exe)) { throw 'TruckSimGPS_Server.exe nao foi gerado' }
          Copy-Item $exe 'releases/TruckSimGPS_Server_GAT_DANOS_1.0.exe' -Force

      - name: Criar atualizador EXE
        shell: powershell
        run: |
          $serverExe = 'releases/TruckSimGPS_Server_GAT_DANOS_1.0.exe'
          $sha = (Get-FileHash $serverExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $source = (Get-Content trucksim-gps-gat/Updater.cs -Raw).Replace('__SHA__', $sha)
          Set-Content trucksim-gps-gat/build/UpdaterBuild.cs $source -Encoding UTF8
          $csc = "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          & $csc /nologo /target:winexe /optimize+ /reference:System.Windows.Forms.dll /out:releases/ATUALIZAR_TRUCKSIM_GPS_GAT_DANOS_1.0.exe trucksim-gps-gat/build/UpdaterBuild.cs
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar atualizador' }
          $upSha = (Get-FileHash releases/ATUALIZAR_TRUCKSIM_GPS_GAT_DANOS_1.0.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            app = 'TruckSim GPS GAT'
            version = '1.0'
            notas = 'Adiciona ao REST do TruckSim GPS os desgastes reais de Motor, Cambio, Cabine, Chassi e Rodas usados pelo GAT Telemetria 1.0.28.'
            update_url = 'https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/ATUALIZAR_TRUCKSIM_GPS_GAT_DANOS_1.0.exe'
            source_url = 'https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/TruckSimGPS_GAT_DANOS_1.0_SOURCE.zip'
            sha256 = $upSha
          }
          $manifest | ConvertTo-Json | Set-Content trucksim_gps_gat_version.json -Encoding UTF8

      - name: Publicar arquivos
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/TruckSimGPS_Server_GAT_DANOS_1.0.exe releases/ATUALIZAR_TRUCKSIM_GPS_GAT_DANOS_1.0.exe releases/TruckSimGPS_GAT_DANOS_1.0_SOURCE.zip trucksim_gps_gat_version.json
          git commit -m "Publica TruckSim GPS GAT com danos reais" || exit 0
          git push
