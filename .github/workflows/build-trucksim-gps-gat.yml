name: Build TruckSim GPS GAT Danos

on:
  push:
    paths:
      - 'trucksim-gps-gat/trigger.txt'
      - '.github/workflows/build-trucksim-gps-gat.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout GAT
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Baixar fonte oficial TruckSim GPS
        shell: powershell
        run: |
          if (Test-Path trucksim-gps-gat/build) { Remove-Item trucksim-gps-gat/build -Recurse -Force }
          New-Item -ItemType Directory -Force -Path trucksim-gps-gat/build | Out-Null
          git clone --depth 1 https://github.com/TruckSim-GPS/trucksim-gps-server.git trucksim-gps-gat/build/trucksim-gps-server
          Remove-Item trucksim-gps-gat/build/trucksim-gps-server/.git -Recurse -Force

      - name: Aplicar campos de danos reais do caminhao
        shell: powershell
        run: |
          $root = Join-Path $PWD 'trucksim-gps-gat/build/trucksim-gps-server'
          $model = Join-Path $root 'source/Funbit.Ets.Telemetry.Server/Data/TelemetryV1.cs'
          $reader = Join-Path $root 'source/Funbit.Ets.Telemetry.Server/Data/ScsTelemetryDataReader.cs'

          $s = Get-Content $model -Raw
          $anchor = '        public float FuelRange { get; set; }'
          if ($s -notmatch 'WearEngine') {
            if (-not $s.Contains($anchor)) { throw 'Ponto FuelRange nao encontrado em TelemetryV1.cs' }
            $insert = @"
        public float FuelRange { get; set; }

        // GAT Telemetria: desgaste real do caminhao (0..1)
        public float WearEngine { get; set; }
        public float WearTransmission { get; set; }
        public float WearCabin { get; set; }
        public float WearChassis { get; set; }
        public float WearWheels { get; set; }
"@
            $s = $s.Replace($anchor, $insert.TrimEnd())
            Set-Content $model $s -Encoding UTF8
          }

          $s = Get-Content $reader -Raw
          $anchor2 = '                FuelRange = dash?.FuelValue?.Range ?? 0f,'
          if ($s -notmatch 'WearEngine = curr') {
            if (-not $s.Contains($anchor2)) { throw 'Ponto FuelRange nao encontrado em ScsTelemetryDataReader.cs' }
            $insert2 = @"
                FuelRange = dash?.FuelValue?.Range ?? 0f,

                // GAT Telemetria: exposicao dos desgastes reais no REST v1
                WearEngine = curr?.DamageValues?.Engine ?? 0f,
                WearTransmission = curr?.DamageValues?.Transmission ?? 0f,
                WearCabin = curr?.DamageValues?.Cabin ?? 0f,
                WearChassis = curr?.DamageValues?.Chassis ?? 0f,
                WearWheels = curr?.DamageValues?.WheelsAvg ?? 0f,
"@
            $s = $s.Replace($anchor2, $insert2.TrimEnd())
            Set-Content $reader $s -Encoding UTF8
          }

          Select-String -Path $model -Pattern 'WearEngine','WearTransmission','WearCabin','WearChassis','WearWheels'
          Select-String -Path $reader -Pattern 'WearEngine = curr','WearTransmission = curr','WearCabin = curr','WearChassis = curr','WearWheels = curr'

      - name: Empacotar codigo-fonte correspondente GPL
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          $src = Join-Path $PWD 'trucksim-gps-gat/build/trucksim-gps-server'
          $zip = Join-Path $PWD 'releases/TruckSimGPS_GAT_DANOS_1.0_SOURCE.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src/*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Restaurar NuGet
        shell: powershell
        run: |
          nuget restore trucksim-gps-gat/build/trucksim-gps-server/source/Funbit.Ets.Telemetry.sln -NonInteractive

      - name: Compilar TruckSim GPS GAT
        shell: powershell
        run: |
          msbuild trucksim-gps-gat/build/trucksim-gps-server/source/Funbit.Ets.Telemetry.sln /m /t:Rebuild /p:Configuration=Release /p:Platform="Mixed Platforms"
          $exe = 'trucksim-gps-gat/build/trucksim-gps-server/source/Funbit.Ets.Telemetry.Server/bin/Release/TruckSimGPS_Server.exe'
          if (-not (Test-Path $exe)) { throw 'TruckSimGPS_Server.exe nao foi gerado' }
          Copy-Item $exe 'releases/TruckSimGPS_Server_GAT_DANOS_1.0.exe' -Force

      - name: Criar atualizador executavel de um clique
        shell: powershell
        run: |
          $serverExe = Join-Path $PWD 'releases/TruckSimGPS_Server_GAT_DANOS_1.0.exe'
          $sha = (Get-FileHash $serverExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $source = @'
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.Net;
          using System.Security.Cryptography;
          using System.Security.Principal;
          using System.Windows.Forms;

          internal static class Program
          {
              const string Url = "https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/TruckSimGPS_Server_GAT_DANOS_1.0.exe";
              const string ExpectedSha = "__SHA__";

              [STAThread]
              static void Main()
              {
                  Application.EnableVisualStyles();
                  if (!IsAdministrator())
                  {
                      try
                      {
                          ProcessStartInfo p = new ProcessStartInfo(Application.ExecutablePath);
                          p.UseShellExecute = true;
                          p.Verb = "runas";
                          Process.Start(p);
                      }
                      catch { MessageBox.Show("A atualizacao precisa de permissao de Administrador.", "GAT - TruckSim GPS", MessageBoxButtons.OK, MessageBoxIcon.Warning); }
                      return;
                  }

                  if (Process.GetProcessesByName("TruckSimGPS_Server").Length > 0 || Process.GetProcessesByName("eurotrucks2").Length > 0)
                  {
                      MessageBox.Show("Feche o ETS2 e o TruckSim GPS antes de atualizar.", "GAT - TruckSim GPS", MessageBoxButtons.OK, MessageBoxIcon.Warning);
                      return;
                  }

                  string target = FindInstall();
                  if (target == null)
                  {
                      MessageBox.Show("Nao encontrei o TruckSim GPS instalado. Instale a versao oficial primeiro.", "GAT - TruckSim GPS", MessageBoxButtons.OK, MessageBoxIcon.Error);
                      return;
                  }

                  string temp = Path.Combine(Path.GetTempPath(), "TruckSimGPS_Server_GAT_DANOS_1.0.exe");
                  try
                  {
                      ServicePointManager.SecurityProtocol = (SecurityProtocolType)3072;
                      using (WebClient wc = new WebClient()) wc.DownloadFile(Url, temp);
                      if (!String.Equals(Sha256(temp), ExpectedSha, StringComparison.OrdinalIgnoreCase))
                          throw new Exception("Falha na verificacao de integridade do arquivo baixado.");

                      string backup = target + ".backup_GAT_" + DateTime.Now.ToString("yyyyMMdd_HHmmss");
                      File.Copy(target, backup, true);
                      File.Copy(temp, target, true);
                      MessageBox.Show("TruckSim GPS atualizado com sucesso para suporte aos danos reais do GAT.\n\nBackup criado em:\n" + backup, "GAT - TruckSim GPS", MessageBoxButtons.OK, MessageBoxIcon.Information);
                  }
                  catch (Exception ex)
                  {
                      MessageBox.Show("Nao foi possivel atualizar o TruckSim GPS.\n\n" + ex.Message, "GAT - TruckSim GPS", MessageBoxButtons.OK, MessageBoxIcon.Error);
                  }
                  finally { try { if (File.Exists(temp)) File.Delete(temp); } catch { } }
              }

              static bool IsAdministrator()
              {
                  WindowsIdentity id = WindowsIdentity.GetCurrent();
                  WindowsPrincipal p = new WindowsPrincipal(id);
                  return p.IsInRole(WindowsBuiltInRole.Administrator);
              }

              static string FindInstall()
              {
                  string[] roots = new string[] { Environment.GetFolderPath(Environment.SpecialFolder.ProgramFiles), Environment.GetFolderPath(Environment.SpecialFolder.ProgramFilesX86) };
                  foreach (string root in roots)
                  {
                      if (String.IsNullOrWhiteSpace(root)) continue;
                      string p = Path.Combine(root, "TruckSim GPS Telemetry Server", "TruckSimGPS_Server.exe");
                      if (File.Exists(p)) return p;
                  }
                  return null;
              }

              static string Sha256(string file)
              {
                  using (FileStream fs = File.OpenRead(file))
                  using (SHA256 sha = SHA256.Create())
                  {
                      byte[] hash = sha.ComputeHash(fs);
                      return BitConverter.ToString(hash).Replace("-", "").ToLowerInvariant();
                  }
              }
          }
          '@
          $source = $source.Replace('__SHA__', $sha)
          Set-Content trucksim-gps-gat/build/Updater.cs $source -Encoding UTF8
          $csc = "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          & $csc /nologo /target:winexe /optimize+ /reference:System.Windows.Forms.dll /out:releases/ATUALIZAR_TRUCKSIM_GPS_GAT_DANOS_1.0.exe trucksim-gps-gat/build/Updater.cs
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar atualizador' }

          $upSha = (Get-FileHash releases/ATUALIZAR_TRUCKSIM_GPS_GAT_DANOS_1.0.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          {
            "app": "TruckSim GPS GAT",
            "version": "1.0",
            "notas": "Adiciona ao REST do TruckSim GPS os desgastes reais de Motor, Cambio, Cabine, Chassi e Rodas usados pelo GAT Telemetria 1.0.28.",
            "update_url": "https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/ATUALIZAR_TRUCKSIM_GPS_GAT_DANOS_1.0.exe",
            "source_url": "https://raw.githubusercontent.com/bidu620-alt/GAT-LOG-Updates/main/releases/TruckSimGPS_GAT_DANOS_1.0_SOURCE.zip",
            "sha256": "$upSha"
          }
          "@ | Set-Content trucksim_gps_gat_version.json -Encoding UTF8

      - name: Publicar binario, atualizador e fonte
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/TruckSimGPS_Server_GAT_DANOS_1.0.exe releases/ATUALIZAR_TRUCKSIM_GPS_GAT_DANOS_1.0.exe releases/TruckSimGPS_GAT_DANOS_1.0_SOURCE.zip trucksim_gps_gat_version.json
          git commit -m "Publica TruckSim GPS GAT com danos reais" || exit 0
          git push
