name: Inspect ParseSession

on:
  push:
    branches:
      - release/server-0.1.3

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover and inspect
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          grep -nEi -C 120 'func ParseSession|type Session|connected\|disconnected|Players:' /tmp/gat-src/internal/core/core.go | head -n 7000
          exit 0
