name: Inspect GAT central journal validation

on:
  push:
    branches: [main]
    paths:
      - 'server-native-0.1/inspect-work-trigger.txt'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Central journal validation
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== local journal / gat_journal validation ==='
            grep -n -C 45 -E 'local_journal_invalid|gat_journal_|journal.*invalid|journal.*verified|verify.*journal|journal.*chain' cloudflare-central/worker.js || true
            echo '=== ranking decision around journal ==='
            grep -n -C 45 -E 'rank_status|automatic_ranking|delivery_rejected|manual|journal' cloudflare-central/worker.js || true
          } > server-native-0.1/inspect-work-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server-native-0.1/inspect-work-result.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inspeciona validação do diário da Central'
          git pull --rebase origin main
          git push
