name: Inspect GAT local journal validation

on:
  push:
    branches: [main]
    paths:
      - 'server-native-0.1/inspect-work-trigger.txt'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover local server source and inspect journal validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gat-src && mkdir -p /tmp/gat-src
          set +e
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          set -e
          test -f /tmp/gat-src/internal/core/core.go
          {
            echo '=== local journal / gat_journal validation ==='
            grep -RIn -C 50 -E 'local_journal_invalid|gat_journal_|journal.*invalid|journal.*verified|verify.*journal|journal.*chain' /tmp/gat-src 2>/dev/null || true
            echo '=== rank decision ==='
            grep -RIn -C 50 -E 'rank_status|automatic_ranking|delivery_rejected|manual|journal' /tmp/gat-src 2>/dev/null || true
          } > server-native-0.1/inspect-work-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server-native-0.1/inspect-work-result.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inspeciona diário do servidor local GAT'
          git pull --rebase origin main
          git push
