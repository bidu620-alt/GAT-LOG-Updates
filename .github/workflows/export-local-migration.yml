name: Export encrypted GAT migration database
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['migration-local/**', '.github/workflows/export-local-migration.yml']
permissions:
  contents: read
concurrency:
  group: gat-log-api-production
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install cryptography
      - name: Freeze writes and encrypt complete export to migration recipient
        run: python migration-local/export.py
