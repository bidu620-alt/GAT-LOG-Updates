name: Build GAT-LOG Agent 0.1.3 fix

on:
  push:
    branches:
      - fix/server-ui-freeze

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover complete core and agent sources
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/gat-src
          cat server-native-0.1/source.part.* | base64 -d | gzip -dc > /tmp/gat-source.tar
          tar -xf /tmp/gat-source.tar -C /tmp/gat-src
          echo 'Recovered files:'
          find /tmp/gat-src -maxdepth 4 -type f -printf '%P\n' | sort
          test -f /tmp/gat-src/go.mod
          test -f /tmp/gat-src/internal/core/core.go
          test -f /tmp/gat-src/cmd/agent/main.go
      - name: Apply 0.1.3 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/gat-src/internal/core/core.go')
          s=p.read_text(encoding='utf-8')
          s=s.replace('InternalVersion = "0.1.0"', 'InternalVersion = "0.1.3"')
          old=r'(?im)^.*?\[MP\]\s+([^\r\n,]+?)\s+(connected|disconnected)(?:,|\s|$)'
          new=r'(?im)^.*?\[MP\]\s+([^\[\r\n,]+?)\s+(connected|disconnected)(?:,|\s|$)'
          if old not in s:
              raise SystemExit('player regex not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          a=Path('/tmp/gat-src/cmd/agent/main.go')
          t=a.read_text(encoding='utf-8')
          # Keep accepted telemetry in memory immediately and persist without delaying the client response.
          t=t.replace('\tif persist {\n\t\ta.saveTelemetry()\n\t}\n\ta.detectEvents(prev, rec)\n\tjsonOut(w, 200, map[string]any{"ok": true, "driver": b.Driver, "received_at": rec.UpdatedAt})',
                      '\tif persist {\n\t\tgo a.saveTelemetry()\n\t}\n\ta.detectEvents(prev, rec)\n\tjsonOut(w, 200, map[string]any{"ok": true, "driver": b.Driver, "received_at": rec.UpdatedAt})')
          a.write_text(t,encoding='utf-8')
          PY
          grep -n 'InternalVersion' /tmp/gat-src/internal/core/core.go | head
          grep -n 'connected|disconnected' /tmp/gat-src/internal/core/core.go | head
          grep -n -A5 -B3 'go a.saveTelemetry' /tmp/gat-src/cmd/agent/main.go || true
      - name: Build Windows agent
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gat-src
          mkdir -p /tmp/dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/dist/GAT_LOG_AGENT.exe ./cmd/agent
          sha256sum /tmp/dist/GAT_LOG_AGENT.exe
          ls -lh /tmp/dist/GAT_LOG_AGENT.exe
      - uses: actions/upload-artifact@v4
        with:
          name: gat-log-agent-0.1.3
          path: /tmp/dist/GAT_LOG_AGENT.exe
          if-no-files-found: error
          retention-days: 7
