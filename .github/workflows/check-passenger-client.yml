name: Check passenger client preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'RoadBETS2-Telemetria/src/GatTelemetry/PassengerTelemetry.cs'
      - 'RoadBETS2-Telemetria/src/GatTelemetry/MainForm.cs'
      - 'RoadBETS2-Telemetria/tests/Passengers/**'
      - '.github/workflows/check-passenger-client.yml'
permissions:
  contents: read
jobs:
  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build RoadBETS2-Telemetria/tests/Passengers/Passengers.csproj -c Release
      - run: .\RoadBETS2-Telemetria\tests\Passengers\bin\Release\net48\Passengers.exe
      - run: dotnet build RoadBETS2-Telemetria/src/GAT_TELEMETRIA.csproj -c Release
